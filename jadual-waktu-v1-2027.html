    if(t==='subjects')return`<fieldset style="border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin:0;min-width:0"><legend style="font-size:12.5px;color:var(--muted)">${l} (boleh pilih lebih daripada satu)</legend><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 10px">${D.subjects.map(s=>`<label style="display:flex;gap:6px;align-items:center;color:var(--fg)"><input type="checkbox" name="${k}" value="${esc(s.code)}" ${(val[k]||[]).includes(s.code)?'checked':''}>${esc(s.name)}</label>`).join('')}</div></fieldset>`;

    if(t==='years')return`<label>${l}<input type="text" name="${k}" value="${esc((val[k]||[]).join(','))}" inputmode="numeric" autocomplete="off" placeholder="Semua tahun"></label>`;
    if(t==='hue')return`<label>${l}<input type="range" name="${k}" min="0" max="359" value="${val[k]}"></label>`;
    return`<label>${l}<input type="text" name="${k}" value="${esc(val[k])}" autocomplete="off"></label>`}).join('');
  const L=document.getElementById('layer');
  L.innerHTML=`<div class="scrim"><div class="dlg" role="dialog" aria-label="${sc.title}"><h2>${sc.title}</h2>
    <form id="f">${f}<div class="act"><button type="submit" class="btn pri">OK</button><button type="button" class="btn" id="cx">Batal</button></div></form></div></div>`;
  const first=L.querySelector('input[type=text]');if(first)first.focus();
  L.querySelector('#cx').onclick=()=>L.innerHTML='';

    e.preventDefault();const fd=new FormData(e.target),o={...val};
    for(const[k,,t]of sc.fields)o[k]=t==='years'?String(fd.get(k)||'').split(/[^0-9]+/).filter(x=>x!=='').map(Number).filter((x,i,a)=>x<=6&&a.indexOf(x)===i).sort((a,b)=>a-b):t==='hue'?+fd.get(k):t==='subjects'?fd.getAll(k):t==='classes'?fd.getAll(k).map(Number):String(fd.get(k)).trim();
    if(!o.name||(sc.fields.some(f=>f[0]==='code')&&!o.code)){toast('Isi nama dan kod');return}
    if(o.cls&&o.cls.length<2){toast('Pilih sekurang-kurangnya dua kelas');return}
    if(o.tahun&&!o.tahun.length)delete o.tahun;
    if(o.cls&&o.sub){const yb=yearBad(o.sub,o.cls);if(yb.length){toast(yearMsg(o.sub,yb));return}}
    if(o.subs&&!o.subs.length){toast('Pilih sekurang-kurangnya satu pelajaran');return}
    if(idx==null){D[sc.key].push(o);S.sel[v]=D[sc.key].length-1}else D[sc.key][idx]=o;
    persist();L.innerHTML='';render()};

  const head=`<tr><th class="dl"></th>${PER.map((p,k)=>{const t=mode==='kelas'?lessonTime(k,[i]):p;
    return`<th class="ph"><span>${y1&&k===PK.p?PK.code:p.n}</span>${h12(t.s)}<br>${h12(t.e)}</th>`}).join('')}</tr>`;
  const rows=DAYS.map((dn,d)=>{
    let cells='',k=0,pi=0;
    while(k<PER.length){
      if(PER[k].rest){cells+='<td class="rest"></td>';k++;continue}
      const info=slotInfo(G,mode,i,d,pi);let span=1;

      if(info){

      }else cells+=mode==='kelas'&&pi===restOf(i)?`<td${ds} class="rest" style="text-align:center;font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--muted)">REHAT<br><span style="font-weight:400">${h12(PER[pi].s-restEx(yearOf(i)))}–${h12(PER[pi].e)}</span></td>`:`<td${ds}></td>`;
      k+=span;pi+=span}
    return`<tr><th class="dl">${dn}</th>${cells}</tr>`}).join('');
  let L=Object.values(leg);
  if(mode==='kelas'){
    /* Legend lists every subject of the class separately, with all its teachers and its waktu per week. */
    const m={};
    DAYS.forEach((_,d)=>PER.forEach((__,p)=>{(G.cls[i][d][p]||[]).forEach(e=>{
      const x=m[e.sub]||(m[e.sub]={sub:e.sub,set:[],slots:new Set()});
      const nm=D.teachers[e.t].name;if(!x.set.includes(nm))x.set.push(nm);x.slots.add(d+','+p)})}));
    L=Object.values(m).map(x=>({sub:x.sub,who:x.set.join(', '),n:x.slots.size}))}
  if(mode==='guru'){

function relifData(){
  const G=build(),t=S.rt,d=relifDay(),out=[],load={};

  D.lessons.forEach(l=>{if(l[1]===d)(busy[l[0]]=busy[l[0]]||[]).push(lessonTime(l[2],l[4]))});
  PER.forEach((p,pi)=>{
    const cs=[];G.tch[t][d][pi].forEach(e=>e.cls.forEach(c=>{if(!cs.includes(c))cs.push(c)}));
    if(!cs.length)return;
    const tm=lessonTime(pi,G.tch[t][d][pi][0].cls);
    const free=D.teachers.map((x,i)=>i).filter(i=>i!==t&&!(busy[i]||[]).some(b=>b.s<tm.e&&tm.s<b.e));
    cs.forEach(c=>{
      const key=`${t}-${d}-${pi}-${c}`;
      let pick=S.assign[key];

      out.push({p,pi,c,key,free,pick,tm})})});
  return{G,out};

  const tm=lessonTime(p,cs);
  D.lessons.forEach(l=>{if(l[0]!==t||l[1]!==d||l[2]===p)return;const o=lessonTime(l[2],l[4]);
    if(o.s<tm.e&&tm.s<o.e)w.push(`${D.teachers[t].name} mengajar ${l[3]} ${l[4].map(c=>D.classes[c].name).join(', ')} ${tmTxt(o)}, bertindih dengan ${tmTxt(tm)}`)});

function tasPlan(c){
  const G=build(),idx=[];
  D.lessons.forEach((l,i)=>{if(l[3]==='TAS'&&l[4].includes(c))idx.push(i)});
  if(!idx.length)return null;
  const multi=idx.some(i=>D.lessons[i][4].length>1);
  const d0=D.lessons[idx[0]][1],ps=[...new Set(idx.map(i=>D.lessons[i][2]))].sort((a,b)=>a-b);
  const n=ps.length,cur=DAYS[d0]+' waktu '+(ps[0]+1)+(n>1?'-'+(ps[n-1]+1):'');
  const last=d=>{let e=-1;PER.forEach((_,p)=>{if(G.cls[c][d][p].length)e=p});return e};
  if(multi)return{c,cur,idx,msg:'TAS dikongsi beberapa kelas, atur sendiri.',ok:false};
  if(ps.some((p,k)=>k&&p!==ps[k-1]+1)||idx.some(i=>D.lessons[i][1]!==d0))return{c,cur,idx,msg:'TAS tidak dalam satu blok, atur sendiri.',ok:false};
  const opts=[];
  for(let d=0;d<DAYS.length;d++){
    const e=last(d);if(e-n+1<0)continue;
    const t0=e-n+1,sw=[],prob=[];
    if(d===d0&&t0===ps[0]){opts.push({d,t0,already:true,prob:[],sw:[]});continue}
    const tIdx=new Set(idx);
    /* occupants of the class at target (not TAS) swap into TAS's old slots */
    D.lessons.forEach((l,i)=>{if(tIdx.has(i)||l[1]!==d||!l[4].includes(c)||l[2]<t0||l[2]>e)return;
      if(l[4].length>1)prob.push(l[3]+' dikongsi kelas lain');else sw.push(i)});
    /* if the target overlaps the old TAS slots on the same day, skip the swap for those */
    const mv=idx.map(i=>[i,D.lessons[i][0],d,D.lessons[i][2]-ps[0]+t0]);
    const busy=(t,dd,pp,ign)=>D.lessons.some((m,j)=>!ign.has(j)&&m[0]===t&&m[1]===dd&&m[2]===pp);
    const ign=new Set([...tIdx,...sw]);
    mv.forEach(([i,t,dd,pp])=>{if(busy(t,dd,pp,ign))prob.push(D.teachers[t].name+' sibuk');});
    sw.forEach(i=>{const l=D.lessons[i],np=ps[0]+(l[2]-t0);
      if(busy(l[0],d0,np,ign))prob.push(D.teachers[l[0]].name+' sibuk di waktu ganti')});
    opts.push({d,t0,prob:[...new Set(prob)],sw,mv});
  }
  const al=opts.find(o=>o.already);
  if(al)return{c,cur,idx,already:true,ok:true,msg:'Sudah di waktu akhir.'};
  const good=opts.filter(o=>!o.prob.length).sort((a,b)=>(a.d===d0?0:1)-(b.d===d0?0:1)||a.d-b.d)[0];
  if(!good)return{c,cur,idx,ok:false,msg:'Tiada hari tanpa pertindihan.'};
  const to=DAYS[good.d]+' waktu '+(good.t0+1)+(n>1?'-'+(good.t0+n):'');
  return{c,cur,idx,ok:true,opt:good,ps,d0,to,msg:'Cadangan: '+to+(good.sw.length?' (tukar dengan '+good.sw.length+' waktu lain)':'')};
}
function tasRows(){
  const cs=[...new Set(D.lessons.filter(l=>l[3]==='PM').flatMap(l=>l[4]))].sort((a,b)=>a-b);
  return cs.map(c=>tasPlan(c)).filter(Boolean);

/* Guru tidak mengajar lebih 7 waktu sehari (perhimpunan tidak dikira). */
const TCAP=7;
/* Had waktu habis mengajar setiap guru (medan teachers[i].habis, cth '11:40'). */
function tEnd(i){const t=D.teachers[i],m=t&&String(t.habis||'').match(/^(\d{1,2})[:.](\d{2})$/);return m?(+m[1])*60+(+m[2]):null}
function tLate(i,p){const e=tEnd(i);return e!=null&&PER[p]&&PER[p].e>e}
/* Waktu kosong di hadapan: guru tidak mengajar pada N waktu pertama setiap hari (medan teachers[i].depan; perhimpunan dan BY tidak dikira). */
function tFront(i){const t=D.teachers[i],n=parseInt(t&&t.depan,10);return n>0?n:0}
function tfRows(G){const out=[];D.teachers.forEach((t,i)=>{const n=tFront(i);if(!n)return;DAYS.forEach((dn,d)=>{for(let p=0;p<n&&p<PER.length;p++)if(G.tch[i][d][p].some(e=>e.sub!=='PER'&&e.sub!=='BY'))out.push({t:i,d,p})})});return out}
/* Guru tidak mengajar lebih TRUN waktu berturutan; selepas itu mesti ada waktu kosong. */
const TRUN=3;
function runEx(row){let n=0,r=0;for(let p=0;p<=row.length;p++){if(p<row.length&&row[p]>0)r++;else{if(r>TRUN)n+=r-TRUN;r=0}}return n}
function trRows(G){const out=[];D.teachers.forEach((t,i)=>DAYS.forEach((dn,d)=>{const row=PER.map((_,p)=>G.tch[i][d][p].some(e=>e.sub!=='PER'&&e.sub!=='BY')?1:0);let r=0,st=0;for(let p=0;p<=row.length;p++){if(p<row.length&&row[p]){if(!r)st=p;r++}else{if(r>TRUN)out.push({t:i,d,from:st,n:r});r=0}}}));return out}
function tlRows(G){const out=[];D.teachers.forEach((t,i)=>{if(tEnd(i)==null)return;DAYS.forEach((dn,d)=>PER.forEach((_,p)=>{if(tLate(i,p)&&G.tch[i][d][p].some(e=>e.sub!=='PER'))out.push({t:i,d,p})}))});return out}
function pjLate(p){return PER[p]&&PER[p].e>PJ_END}
/* PJ tidak boleh pada hari Isnin (hari 0). */
function pjBad(d,p){return d===0||pjLate(p)}
/* Hari PJ sesebuah kelas mesti berselang: tidak pada dua hari berturutan. */
function tdRows(G){const out=[];D.teachers.forEach((t,i)=>DAYS.forEach((dn,d)=>{let n=0;PER.forEach((_,p)=>{if(G.tch[i][d][p].some(e=>e.sub!=='PER'))n++});if(n>TCAP)out.push({t:i,d,n})}));return out}
function pjAdjTry(c,d){const has=x=>D.lessons.some(l=>l[1]===x&&l[4].includes(c)&&/^PJ\d/.test(l[3]));return !has(d)&&(has(d-1)||has(d+1))}
function pjAdjRows(G){const out=[];D.classes.forEach((cl,c)=>{const days=[];DAYS.forEach((_,d)=>{if(PER.some((__,p)=>G.cls[c][d][p].some(e=>/^PJ\d/.test(e.sub))))days.push(d)});for(let i=1;i<days.length;i++)if(days[i]-days[i-1]===1)out.push({c,a:days[i-1],b:days[i]})});return out}
function famOf(sub){return /^PJ\d/.test(sub)?'PJ':String(sub).replace(/\(.*$/,'')}
function hadOn(c){return HAD.tahun.includes(yearOf(c))}
function hadRows(G){const out=[];D.classes.forEach((cl,c)=>{if(!hadOn(c))return;DAYS.forEach((dn,d)=>{const f=new Set();PER.forEach((_,p)=>G.cls[c][d][p].forEach(e=>{if(e.sub!=='PER'&&e.sub!==PK.code)f.add(famOf(e.sub))}));if(f.size>HAD.max)out.push({c,d,n:f.size,list:[...f]})})});return out}
function janaSetup(only){
  const NP=PER.length,ND=DAYS.length,G=build();
  const fixed=[],mov=[];
  D.lessons.forEach((l,i)=>{(l[4].length&&l[3]&&l[3]!==PK.code)?mov.push(i):fixed.push(i)});
  /* units: lessons sharing a class in the same slot */
  const bySlot={};mov.forEach(i=>{const l=D.lessons[i],k=l[1]*NP+l[2];(bySlot[k]=bySlot[k]||[]).push(i)});
  const units=[];
  Object.keys(bySlot).forEach(k=>{
    const ids=bySlot[k],par=ids.map((_,j)=>j),f=x=>par[x]===x?x:(par[x]=f(par[x]));
    for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++)
      if(D.lessons[ids[a]][4].some(c=>D.lessons[ids[b]][4].includes(c)))par[f(a)]=f(b);
    const gr={};ids.forEach((id,j)=>(gr[f(j)]=gr[f(j)]||[]).push(id));
    Object.values(gr).forEach(g=>{
      const cls=[...new Set(g.flatMap(i=>D.lessons[i][4]))].sort((a,b)=>a-b);
      const tpl=g.map(i=>{const l=D.lessons[i];return{t:l[0],sub:l[3],cls:l[4]}}).sort((a,b)=>a.t-b.t||a.sub.localeCompare(b.sub)||a.cls[0]-b.cls[0]);
      units.push({d:+k/NP|0,p:k%NP,cls,tpl,sig:tpl.map(x=>x.t+'|'+x.sub+'|'+x.cls).join(';'),ck:cls.join(',')})})});
  /* merge consecutive identical units into blocks */
  units.sort((a,b)=>a.ck<b.ck?-1:a.ck>b.ck?1:a.sig<b.sig?-1:a.sig>b.sig?1:a.d-b.d||a.p-b.p);
  const blocks=[];
  units.forEach(u=>{const b=blocks[blocks.length-1];
    if(b&&b.ck===u.ck&&b.sig===u.sig&&b.d===u.d&&b.s+b.len===u.p)b.len++;
    else blocks.push({ck:u.ck,sig:u.sig,cls:u.cls,tpl:u.tpl,d:u.d,s:u.p,len:1})});
  /* class facts: rest period and last period of each day */
  const rest=[],last=[],pm=[];
  D.classes.forEach((_,c)=>{
    let used=Array(NP).fill(false),ends=Array(ND).fill(-1);
    DAYS.forEach((__,d)=>PER.forEach((___,p)=>{if(G.cls[c][d][p].some(e=>e.sub!==PK.code)){used[p]=true;ends[d]=p}}));
    let mx=-1;used.forEach((u,p)=>{if(u)mx=p});
    let r=restOf(c);if(r<0)for(let p=1;p<mx;p++)if(!used[p]){r=p;break}
    rest[c]=r;last[c]=ends;pm[c]=D.lessons.some(l=>l[3]==='PM'&&l[4].includes(c))});
  /* occupancy */
  const tOcc=D.teachers.map(()=>DAYS.map(()=>Array(NP).fill(0)));
  const tSh=D.teachers.map(()=>DAYS.map(()=>Array(NP).fill(0)));
  fixed.forEach(i=>{const l=D.lessons[i];if(tOcc[l[0]]){tOcc[l[0]][l[1]][l[2]]++;if(PK.on&&l[3]!==PK.code&&l[2]>PK.p&&y1Only(l[4]))tSh[l[0]][l[1]][l[2]]++}});
  blocks.forEach(b=>{b.y1=y1Only(b.cls)});
  const J={blocks,rest,last,pm,tOcc,tSh,fixed,NP,ND,conf:0,pref:0,dup:{},fam:{},dn:{},exc:0,adj:0,pjd:{},td:D.teachers.map(()=>DAYS.map(()=>0)),tex:0,tl:0,tf:0,run:0,tc:D.teachers.map(()=>DAYS.map(()=>Array(PER.length).fill(0))),cap:D.classes.map((_,c)=>hadOn(c)?HAD.max:99)};
  /* group lists for swaps */
  blocks.forEach(b=>{b.fix=!!only&&!b.cls.every(c=>only[c])});
  const grp={};blocks.forEach((b,i)=>{if(!b.fix)(grp[b.ck+'#'+b.len]=grp[b.ck+'#'+b.len]||[]).push(i)});
  J.grp=grp;
  fixed.forEach(i=>{const l=D.lessons[i];if(l[3]!=='PER'&&J.td[l[0]])J.td[l[0]][l[1]]++});
  J.td.forEach(a=>a.forEach(n=>{if(n>TCAP)J.tex+=n-TCAP}));
  blocks.forEach(b=>janaAdd(J,b,1));
  J.conf=janaConf(J);
  return J;
}
/* add (+1) or remove (-1) a block; returns delta of conflicts */
/* conflicts = same-waktu overlaps + Year 1 shifted lesson overlapping the next waktu of another class */
function janaConf(J){let n=0;
  J.tOcc.forEach((td,t)=>td.forEach((o,d)=>{const h=J.tSh[t][d];for(let p=0;p<J.NP;p++){if(o[p]>1)n+=o[p]-1;if(p+1<J.NP)n+=h[p]*(o[p+1]-h[p+1])}}));
  return n}
function janaAdd(J,b,sg){
  let dc=0;const T=new Set(b.tpl.map(x=>x.t));
  T.forEach(t=>{for(let k=0;k<b.len;k++){const o=J.tOcc[t];if(!o)continue;const p=b.s+k,c=o[b.d][p],h=J.tSh[t][b.d];
    const sh=PK.on&&b.y1&&p>PK.p;
    /* half-overlap delta: neighbours at p-1 / p+1 are unaffected by this lesson */
    const hd=sh?(p+1<J.NP?o[b.d][p+1]-h[p+1]:0):(p>0?h[p-1]:0);
    dc+=sg*hd;
    if(sg>0){if(c>=1)dc++;o[b.d][p]=c+1;if(sh)h[p]++}else{if(c>=2)dc--;o[b.d][p]=c-1;if(sh)h[p]--}}});
  T.forEach(t=>{const row=J.tc[t]&&J.tc[t][b.d];if(!row)return;const e0=runEx(row);for(let k=0;k<b.len;k++)row[b.s+k]+=sg;J.run+=runEx(row)-e0});
  T.forEach(t=>{if(!J.td[t])return;const a=J.td[t],n0=a[b.d],n1=n0+sg*b.len;
    J.tex+=Math.max(0,n1-TCAP)-Math.max(0,n0-TCAP);a[b.d]=n1;
    if(tEnd(t)!=null)for(let k=0;k<b.len;k++)if(tLate(t,b.s+k))J.tl+=sg;
    const nf=tFront(t);if(nf)for(let k=0;k<b.len;k++)if(b.s+k<nf)J.tf+=sg});
  b.cls.forEach(c=>{[...new Set(b.tpl.filter(x=>x.cls.includes(c)).map(x=>x.sub))].forEach(s=>{
    const key=c+'|'+b.d+'|'+s,n=J.dup[key]||0;
    if(sg>0)J.dupc=(J.dupc||0)+(n>=1?1:0);else J.dupc=(J.dupc||0)-(n>=2?1:0);
    J.dup[key]=n+sg});
    [...new Set(b.tpl.filter(x=>x.cls.includes(c)).map(x=>famOf(x.sub)))].forEach(f=>{
      const k=c+'|'+b.d,kf=k+'|'+f,n=J.fam[kf]||0,cap=J.cap[c];
      if(sg>0){if(n===0){J.dn[k]=(J.dn[k]||0)+1;if(J.dn[k]>cap)J.exc++}}
      else if(n===1){if(J.dn[k]>cap)J.exc--;J.dn[k]--}
      J.fam[kf]=n+sg});
    if(b.tpl.some(x=>x.cls.includes(c)&&/^PJ\d/.test(x.sub))){
      const k0=c+'|'+b.d,n0=J.pjd[k0]||0,nb=(J.pjd[c+'|'+(b.d-1)]||0)>0,na=(J.pjd[c+'|'+(b.d+1)]||0)>0;
      if(sg>0){if(n0===0)J.adj+=(nb?1:0)+(na?1:0)}else if(n0===1)J.adj-=(nb?1:0)+(na?1:0);
      J.pjd[k0]=n0+sg}});
  return dc;
}
function janaPref(J,b){
  let c=0;
  b.tpl.forEach(x=>{
    if(/^PJ\d/.test(x.sub))x.cls.forEach(cl=>{for(let k=0;k<b.len;k++)if(pjBad(b.d,b.s+k))c++});
    if(x.sub==='TAS')x.cls.forEach(cl=>{const at=b.s+b.len-1===J.last[cl][b.d];if(J.pm[cl]?!at:at)c++})});
  return c;
}
function janaStats(J){
  let pj=0,pjAll=0,tas=0,tasAll=0,tasN=0;
  J.blocks.forEach(b=>b.tpl.forEach(x=>{
    if(/^PJ\d/.test(x.sub))x.cls.forEach(cl=>{pjAll+=b.len;for(let k=0;k<b.len;k++)if(pjBad(b.d,b.s+k))pj++});
    if(x.sub==='TAS')x.cls.forEach(cl=>{const at=b.s+b.len-1===J.last[cl][b.d];if(J.pm[cl]){tasAll++;if(!at)tas++}else if(at)tasN++})}));
  const conf=janaConf(J);
  return{pj,pjAll,tas,tasAll,tasN,conf,dup:J.dupc||0,exc:J.exc||0,adj:J.adj||0,tex:J.tex||0,tl:J.tl||0,tf:J.tf||0,run:J.run||0};
}
/* run annealing in chunks; cb(progress,done) */
function janaRun(J,iters,cb){
  const B=J.blocks,keys=Object.keys(J.grp).filter(k=>J.grp[k].length>1);
  const W={c:100,p:80,d:2,e:50,a:80,t:12,l:80,f:80,r:15};
  const prefIdx=[];B.forEach((b,i)=>{if(b.fix)return;if(janaPref(J,b)>0||b.tpl.some(x=>/^PJ\d/.test(x.sub)||x.sub==='TAS'))prefIdx.push(i)});
  const total=B.reduce((a,b)=>a+janaPref(J,b),0);J.pref=total;
  const byC={};B.forEach((b,i)=>{if(!b.fix&&b.cls.length===1)(byC[b.cls[0]]=byC[b.cls[0]]||[]).push(i)});
  Object.values(byC).forEach(a=>a.sort((x,y)=>B[x].d-B[y].d||B[x].s-B[y].s));
  const posOf={};Object.entries(byC).forEach(([c,a])=>a.forEach((bi,k)=>{posOf[bi]=k}));
  let it=0;const t0=3,t1=0.15;
  function cost(){return W.c*J.conf+W.p*J.pref+W.d*(J.dupc||0)+W.e*(J.exc||0)+W.a*(J.adj||0)+W.t*(J.tex||0)+W.l*(J.tl||0)+W.f*(J.tf||0)+W.r*(J.run||0)}
  function place(list){
    let dc=0,dp=0;list.forEach(([b])=>{dp-=janaPref(J,b);dc+=janaAdd(J,b,-1)});
    const old=list.map(([b])=>[b,b.d,b.s]);
    list.forEach(([b,d,s])=>{b.d=d;b.s=s});
    list.forEach(([b])=>{dc+=janaAdd(J,b,1);dp+=janaPref(J,b)});
    J.conf+=dc;J.pref+=dp;return old}
  function seg(arr,i,T){const r=[];let L=0;
    for(let j=i;j<arr.length&&L<T;j++){const b=B[arr[j]];
      if(j>i){const q=B[arr[j-1]];if(b.d!==q.d||b.s!==q.s+q.len)return null}
      r.push(arr[j]);L+=b.len}
    return L===T?r:null}
  function step(){
    const T=t0*Math.pow(t1/t0,it/iters);
    let i;
    if(Math.random()<0.5&&prefIdx.length)i=prefIdx[Math.random()*prefIdx.length|0];else i=Math.random()*B.length|0;
    const a=B[i];let list;
    if(a.fix)return;
    if(a.cls.length===1&&Math.random()<0.8){
      const arr=byC[a.cls[0]],Tn=1+(Math.random()*3|0);
      const A=seg(arr,posOf[i],Tn);if(!A)return;
      const k2=Math.random()*arr.length|0,Bs=seg(arr,k2,Tn);if(!Bs)return;
      if(A.some(x=>Bs.includes(x)))return;
      const fa=B[A[0]],fb=B[Bs[0]];list=[];
      let d=fb.d,s=fb.s;A.forEach(x=>{list.push([B[x],d,s]);s+=B[x].len});
      d=fa.d;s=fa.s;Bs.forEach(x=>{list.push([B[x],d,s]);s+=B[x].len})}
    else{
      const g=J.grp[a.ck+'#'+a.len];if(g.length<2)return;
      const j=g[Math.random()*g.length|0];if(j===i)return;const b=B[j];if(a.d===b.d&&a.s===b.s)return;
      list=[[a,b.d,b.s],[b,a.d,a.s]]}
    const c0=cost(),old=place(list),dl=cost()-c0;
    if(dl>0&&Math.random()>=Math.exp(-dl/T))place(old.map(([b,d,s])=>[b,d,s]))}
  function chunk(){
    const end=Math.min(iters,it+20000);
    for(;it<end;it++)step();
    cb(it/iters,it>=iters);
    if(it<iters)setTimeout(chunk,0)}
  chunk();
}
function janaApply(J){
  const keep=J.fixed.map(i=>D.lessons[i]),out=[];
  J.blocks.forEach(b=>{for(let k=0;k<b.len;k++)b.tpl.forEach(x=>out.push([x.t,b.d,b.s+k,x.sub,x.cls]))});
  S.undo=JSON.stringify(D.lessons);
  D.lessons=keep.concat(out);persist();
}

function janaStart(scoped){
  if(!canEdit()){toast('Anda hanya boleh melihat');return}

/* ---------- Bilangan waktu setiap kelas ---------- */
function bilPat(keys){
  const a=[...keys].map(k=>k.split(',').map(Number)).sort((x,y)=>x[0]-y[0]||x[1]-y[1]),r=[];let run=0,pd=-9,pp=-9;
  a.forEach(([d,p])=>{if(d===pd&&p===pp+1)run++;else{if(run)r.push(run);run=1}pd=d;pp=p});if(run)r.push(run);

function bilParse(t){t=String(t||'').replace(/\s/g,'');if(!/^\d+(\+\d+)*$/.test(t))return null;return t.split('+').map(Number).sort((a,b)=>b-a)}
/* rearrange the cells of one subject in a class into blocks of the wanted sizes */
function bilSplit(c,sub,sizes){
  const G=build(),grid=bilGrid(c,G);
  const mine=D.lessons.map((l,i)=>[l,i]).filter(([l])=>l[3]===sub&&l[4].includes(c));
  const sold=new Set(mine.map(([l])=>l[1]+','+l[2]));
  if(sold.size!==sizes.reduce((a,b)=>a+b,0))return{ok:false,msg:'jumlah pecahan tidak sama dengan bilangan waktu'};
  if(bilPat(sold).join('+')===sizes.join('+'))return{ok:true,same:true};
  if(mine.some(([l])=>l[4].length>1))return{ok:false,msg:'dikongsi kelas lain, atur sendiri'};
  const first=[...sold].sort((a,b)=>{const x=a.split(',').map(Number),y=b.split(',').map(Number);return x[0]-y[0]||x[1]-y[1]})[0];
  const tpl=mine.filter(([l])=>l[1]+','+l[2]===first).map(([l])=>l);
  const unit=k=>{const[d,p]=k.split(',').map(Number);return D.lessons.map((l,i)=>[l,i]).filter(([l])=>l[1]===d&&l[2]===p&&l[4].includes(c))};
  const swappable=k=>{if(sold.has(k))return true;const u=unit(k);return u.length>0&&u.every(([l])=>l[4].length===1&&l[3]!=='PER')};
  const ok=k=>grid.has(k)&&swappable(k);

  const chosen=[],usedDays=new Set();
  function leaf(){
    const T=new Set();chosen.forEach(([d,p,k])=>{for(let q=0;q<k;q++)T.add(d+','+(p+q))});
    const disp=[...T].filter(k=>!sold.has(k)),free=[...sold].filter(k=>!T.has(k));
    if(disp.length!==free.length)return;
    const units=disp.map(k=>({k,u:unit(k)}));
    let cost=0;units.forEach(({k,u})=>{const[d,p]=k.split(',').map(Number);
      const nb=[p-1,p+1].some(q=>D.lessons.some(l=>l[1]===d&&l[2]===q&&l[4].includes(c)&&u.some(([m])=>m[3]===l[3]&&m[0]===l[0])));cost+=nb?20:1});
    if(best&&cost>=best.cost)return;
    /* vacated teacher slots */
    const vac=new Map();const addV=(t,d,p)=>{const kk=t+'|'+d+'|'+p;vac.set(kk,(vac.get(kk)||0)+1)};
    mine.forEach(([l])=>addV(l[0],l[1],l[2]));units.forEach(({u})=>u.forEach(([l])=>addV(l[0],l[1],l[2])));
    const busy=(t,d,p,nw)=>{const kk=t+'|'+d+'|'+p;return G.tch[t][d][p].length-(vac.get(kk)||0)>0||nw.has(kk)};
    const nw=new Set();
    for(const[d,p,k]of chosen)for(let q=0;q<k;q++)for(const l of tpl){const kk=l[0]+'|'+d+'|'+(p+q);if(busy(l[0],d,p+q,nw))return;nw.add(kk)}
    /* assign displaced units to free cells */
    const asg=[];
    const rec=(i,usedF)=>{if(i===units.length)return true;
      for(let f=0;f<free.length;f++){if(usedF.has(f))continue;const[d,p]=free[f].split(',').map(Number);
        const added=[];let good=true;
        for(const[l]of units[i].u){const kk=l[0]+'|'+d+'|'+p;if(busy(l[0],d,p,nw)){good=false;break}nw.add(kk);added.push(kk)}
        if(good){usedF.add(f);asg[i]=free[f];if(rec(i+1,usedF))return true;usedF.delete(f)}
        added.forEach(x=>nw.delete(x))}
      return false};
    if(!rec(0,new Set()))return;

    const k=sizesD[i];

      for(let p=0;p+k<=PER.length;p++){
        let good=true;for(let q=0;q<k;q++)if(!ok(d+','+(p+q))){good=false;break}
        if(!good)continue;

  go(0);

  best.T.forEach(([d,p,k])=>{for(let q=0;q<k;q++)tpl.forEach(l=>add.push([l[0],d,p+q,sub,[c]]))});
  D.lessons=D.lessons.filter((_,i)=>!rm.has(i)).concat(add);
  return{ok:true,moved:best.units.length};
}

/* Change the number of waktu of subjects in class c to q[sub], with optional splits bs[sub] and teachers bt[sub] for subjects not yet in the class. */
function bilDo(c,q,bs,bt){
  const bd=bilData(c),G0=build(),y=yearOf(c);

  const grid=bilGrid(c,G0);
  const log=[],miss=[];
  const slotsOfK=sub=>{const m=new Set();D.lessons.forEach(l=>{if(l[3]===sub&&l[4].includes(c))m.add(l[1]+','+l[2])});return m.size};
  const slotsOf=sub=>{const m=new Set();D.lessons.forEach(l=>{if(l[3]===sub&&l[4].includes(c))m.add(l[1]+','+l[2])});return[...m].map(k=>k.split(',').map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1])};

  bd.rows.forEach(r=>{const want=q[r.sub];if(want==null||want<=r.n)return;

    if(r.n===0){

      else{const t=bt&&bt[r.sub];if(t==null||!D.teachers[t]){miss.push(r.sub+' belum ada guru');return}tpl.push([t,0,0,r.sub,[c]])}}
    else{const last=slotsOf(r.sub).pop();
      D.lessons.forEach(l=>{if(l[3]===r.sub&&l[4].includes(c)&&l[1]===last[0]&&l[2]===last[1])tpl.push(l)});
      if(tpl.some(l=>l[4].length>1)){miss.push(r.sub+' dikongsi kelas lain, tambah sendiri');return}}

      if(!free.length)break;

function anaKelasData(c,G){
  const grid=bilGrid(c,G),occ=new Set(),subs={},issues=[],dayN=DAYS.map(()=>0),teach=new Set();
  DAYS.forEach((dn,d)=>PER.forEach((p,k)=>{
    const es=G.cls[c][d][k];if(!es.length)return;
    const real=es.filter(e=>e.sub!=='PER');
    if(real.length){occ.add(d+','+k);dayN[d]++}
    es.forEach(e=>{teach.add(e.t);const x=subs[e.sub]||(subs[e.sub]={sub:e.sub,slots:new Set(),t:new Set(),days:{}});
      x.slots.add(d+','+k);x.t.add(D.teachers[e.t].name);(x.days[d]=x.days[d]||new Set()).add(k);
      if(G.tch[e.t][d][k].length>1)issues.push(`${dn} waktu ${p.n}: ${D.teachers[e.t].name} bertindih (${G.tch[e.t][d][k].map(z=>z.sub).join(' dan ')})`)});
    if(k===restOf(c))issues.push(`${dn}: pelajaran pada waktu rehat (${[...new Set(es.map(e=>e.sub))].join(', ')})`)}));
  const r=restOf(c);
  Object.values(subs).forEach(x=>{
    if(/^PJ\d/.test(x.sub))[...x.slots].forEach(k=>{const[d,p]=k.split(',').map(Number);if(pjBad(d,p))issues.push(d===0?`${x.sub} pada hari ${DAYS[d]} (PJ tidak boleh hari Isnin)`:`${x.sub} ${DAYS[d]} waktu ${p+1} tamat selepas 10:40`)});
    Object.entries(x.days).forEach(([d,ks])=>{const a=[...ks].sort((u,v)=>u-v);let runs=1;for(let i=1;i<a.length;i++)if(a[i]!==a[i-1]+1)runs++;
      if(runs>1&&x.sub!=='PER')issues.push(`${x.sub} berulang pada ${DAYS[d]} (waktu ${a.map(n=>n+1).join(', ')})`)})});
  const kur=kurOf(c);

  const empty=[...grid].filter(k=>!occ.has(k));
  if(empty.length)issues.push(`${empty.length} waktu kosong`);
  return{grid:grid.size,occ:occ.size,empty:empty.length,subs,issues:[...new Set(issues)],dayN,teach:teach.size,kur};
}

    const r=rel(el.getBoundingClientRect());if(r.w<=0||r.h<=0)continue;

    const sd=[['Top',r.l,y,r.l+r.w,y],['Bottom',r.l,y+r.h,r.l+r.w,y+r.h],['Left',r.l,y,r.l,y+r.h],['Right',r.l+r.w,y,r.l+r.w,y+r.h]];
    for(const [n,x1,y1,x2,y2] of sd){const w=parseFloat(st['border'+n+'Width']);if(!(w>0)||st['border'+n+'Style']==='none')continue;const c=col(st['border'+n+'Color']);if(!c||c.a<0.05)continue;
      ops.push(cs(c)+' RG '+f(Math.max(w*k,0.4))+' w '+f(X(x1))+' '+f(Y(y1))+' m '+f(X(x2))+' '+f(Y(y2))+' l S')}
  }
  const cv=document.createElement('canvas').getContext('2d');
  const mp={'–':'\x96','—':'\x97','‘':'\x91','’':'\x92','“':'\x93','”':'\x94','•':'\x95','…':'\x85','×':'\xd7'};
  const enc=t=>{let o='';for(const ch of t){const c=ch.charCodeAt(0);o+=mp[ch]||(c<256?ch:'?')}return o.replace(/([\\()])/g,'\\$1')};
  const tw=document.createTreeWalker(host,NodeFilter.SHOW_TEXT,{acceptNode:n=>/\S/.test(n.data)&&!/^(SCRIPT|STYLE)$/.test(n.parentNode.tagName)?1:2});
  const rg=document.createRange();let n;
  while(n=tw.nextNode()){
    const pe=n.parentNode,st=getComputedStyle(pe);if(st.display==='none'||st.visibility==='hidden')continue;
    const c=col(st.color)||{r:0,g:0,b:0};const fs=parseFloat(st.fontSize),bold=parseInt(st.fontWeight)>=600||st.fontWeight==='bold';
    const up=st.textTransform==='uppercase';cv.font=(bold?'bold ':'')+fs+'px Arial,Helvetica,sans-serif';
    const re=/\S+/g;let m;
    while(m=re.exec(n.data)){
      rg.setStart(n,m.index);rg.setEnd(n,m.index+m[0].length);const r=rel(rg.getBoundingClientRect());if(r.w<=0||r.h<=0)continue;
      let word=up?m[0].toUpperCase():m[0];const mw=cv.measureText(word).width||1;
      const tz=Math.max(50,Math.min(120,r.w/mw*100));
      const [i,y]=place(r.t,r.h);
      pg(i).push('BT /'+(bold?'F2':'F1')+' '+f(fs*k)+' Tf '+f(tz)+' Tz '+cs(c)+' rg '+f(X(r.l))+' '+f(Y(y+r.h*0.78))+' Td ('+enc(word)+') Tj ET');
    }
  }
  const np=Math.max(1,pages.length);
  const objs=[];objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  const kids=[];for(let i=0;i<np;i++)kids.push((5+i*2)+' 0 R');
  objs[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+np+' >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  for(let i=0;i<np;i++){
    const body=(pages[i]||[]).join('\n');
    objs[5+i*2]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+f(PWpt)+' '+f(PHpt)+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+i*2)+' 0 R >>';
    objs[6+i*2]='<< /Length '+body.length+' >>\nstream\n'+body+'\nendstream';
  }
  let out='%PDF-1.4\n',offs=[];
  for(let i=1;i<objs.length;i++){offs[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n'}

  for(let i=1;i<objs.length;i++)out+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return{blob:new Blob([u],{type:'application/pdf'}),pages:np};

async function savePdf(){
  if(pdfBusy)return;pdfBusy=true;
  const btn=document.querySelector('[data-a="savepdf"]');const old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='Menjana PDF…'}
  let host=null;const root=document.documentElement,oldTheme=root.getAttribute('data-theme');
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!dl){toast('Simpan PDF tidak tersedia pada paparan ini');return}
    await new Promise(r=>setTimeout(r,30));
    const ob=document.querySelector('[data-or][aria-pressed="true"]'),land=!(ob&&ob.dataset.or==='p');
    const PW=land?1123:794;
    const mn=document.getElementById('main');
    const m=mn.cloneNode(true);m.removeAttribute('id');
    m.querySelectorAll('.noprint,style,script,button').forEach(x=>x.remove());
    root.setAttribute('data-theme','light');
    host=document.createElement('div');host.className='wrap';
    host.style.cssText='position:absolute;left:0;top:0;width:'+PW+'px;max-width:none;margin:0;padding:0;background:#fff;color:#000;z-index:-1;visibility:hidden';
    m.style.cssText='width:'+PW+'px;max-width:none;margin:0;padding:0;background:#fff;border:0;box-shadow:none';
    m.querySelectorAll('.tw').forEach(t=>{t.style.maxHeight='none';t.style.overflow='visible'});
    host.appendChild(m);document.body.appendChild(host);
    host.style.visibility='visible';
    const secs=[...m.querySelectorAll('.sec')];
    let units=secs.length?[]:[...m.querySelectorAll('tr')];
    for(const sc of secs){units.push(sc);units.push(...sc.querySelectorAll('tr'))}
    const {blob,pages}=buildPdf(host,land,units);
    host.remove();host=null;
    if(oldTheme===null)root.removeAttribute('data-theme');else root.setAttribute('data-theme',oldTheme);
    const nm='jadual-'+String(S.preview||'cetak').replace(/[^a-z_]/gi,'')+'.pdf';
    await dl.save({filename:nm,data:blob});
    toast('PDF disimpan ('+pages+' halaman)');
  }catch(e){
    if(e&&e.code==='declined')return;
    toast(e&&e.code?'Simpan PDF tidak tersedia pada paparan ini':'Gagal menjana PDF: '+(e&&e.message||e));
  }finally{
    if(host)host.remove();
    if(oldTheme===null)root.removeAttribute('data-theme');else root.setAttribute('data-theme',oldTheme);
    pdfBusy=false;
    const b=document.querySelector('[data-a="savepdf"]');if(b){b.disabled=false;b.textContent=old||'Simpan PDF'}
  }
}

  if(b.dataset.a==='yrbuang'){if(!canEdit()){toast('Anda hanya boleh melihat');return}yrBuang();return}
  if(b.dataset.a==='yrundo'){if(S.undo){D.lessons=JSON.parse(S.undo);S.undo=null;S.yrdone=false;S.yrmsg='';persist();render()}return}
  if(b.dataset.a==='tasapply'){if(!canEdit()){toast('Anda hanya boleh melihat');return}tasApply();return}
  if(b.dataset.a==='gundo2'){if(S.undo){D.lessons=JSON.parse(S.undo);S.undo=null;persist();render()}return}
  if(b.dataset.a==='resetno'){S.resetArm=false;render();return}
  if(b.dataset.a==='toggleedit'){S.edit=!S.edit;render();return}
  if(b.dataset.a==='nologo'){D.school.logo='';persist();render();return}
  if(b.dataset.a==='relifsave'){saveRelif();return}
  if(b.dataset.a==='relifdel'){delRelif();return}
  if(b.dataset.a==='copy')copy(v==='relif'?relifText():ttText(build()));
  if(b.dataset.a==='reset'){if(!canEdit()){toast('Anda hanya boleh melihat');return}if(!S.resetArm){S.resetArm=true;render();return}resetAll();return}
});
main.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='anq'){S.anq=t.value;const pos=t.selectionStart;render();const n=document.getElementById('anq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}if(t.dataset&&t.dataset.sk){D.school[t.dataset.sk]=t.value;save()}});
main.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pa'){S.pa=t.value;return}
  if(t.id==='pb'){S.pb=t.value;return}
  if(t.dataset&&t.dataset.pc!=null){S.pcls=S.pcls||{};S.pcls[t.dataset.pc]=t.checked;return}
  if(t.id==='paddsub'){if(t.value){D.pairSubs=D.pairSubs||[];D.pairSubs.push(t.value);persist();render()}return}
  if(t.dataset&&t.dataset.rx!=null){D.rehatEx=D.rehatEx||{};D.rehatEx[t.dataset.rx]=Math.max(0,Math.min(29,+t.value||0));persist();render();return}
  if(t.dataset&&t.dataset.rh!=null){D.rehat=D.rehat||{};D.rehat[t.dataset.rh]=+t.value;persist();render();return}
  if(t.id==='logo'&&t.files&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      D.school.logo=c.toDataURL('image/png');persist();render()};im.onerror=()=>toast('Fail gambar tidak sah');im.src=fr.result};
    fr.readAsDataURL(t.files[0]);return}
  if(t.dataset&&t.dataset.jc!=null){S.jscope=S.jscope||{};S.jscope[t.dataset.jc]=t.checked;render();return}
  if(t.id==='bk'){S.bk=+t.value;S.bq={};S.bs={};S.bt={};S.bmsg='';S.kmsg='';render();return}
  if(t.id==='kury'){const y=+t.dataset.y,{o,bad}=kurParse(t.value);D.kur=D.kur||{};if(Object.keys(o).length)D.kur[y]=o;else delete D.kur[y];
    S.kmsg=bad.length?'Tidak dikenali: '+bad.join(', ')+'. Guna kod atau nama pelajaran.':'';persist();render();return}
  if(t.dataset&&t.dataset.bt!=null){S.bt=S.bt||{};if(t.value==='')delete S.bt[t.dataset.bt];else S.bt[t.dataset.bt]=+t.value;render();return}
  if(t.dataset&&t.dataset.bs!=null){S.bs=S.bs||{};S.bs[t.dataset.bs]=t.value.trim();render();return}
  if(t.dataset&&t.dataset.bq!=null){S.bq=S.bq||{};S.bq[t.dataset.bq]=Math.max(0,Math.min(40,+t.value||0));render();return}
  if(t.id==='jsel'){S.jSel=+t.value;render()}
  if(t.id==='rt'){S.rt=+t.value;S.assign={};render()}
  if(t.id==='rdate'&&t.value){S.rdate=t.value;S.assign={};render()}
  if(t.dataset&&t.dataset.k){S.assign[t.dataset.k]=+t.value;render()}
});
render();
initShared();
/* Re-render when the screen crosses the phone width (rotate, resize), unless a dialog or input is open. */
try{const onMq=()=>{const ae=document.activeElement;if(document.getElementById('layer').innerHTML===''&&!(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)))render()};
  MQ.addEventListener?MQ.addEventListener('change',onMq):MQ.addListener&&MQ.addListener(onMq)}catch(e){}
</script>
<script>
/* ---------- Borang Subjek Guru: ketua panitia isi subjek + kelas setiap guru, disimpan dalam db halaman ini (koleksi "borang") ---------- */
(function(){
const N=6,LAIN='__lain__',OLEH='jw-borang-oleh',NOTEACH=['PER','BY'];
const st=document.createElement('style');
st.textContent=`.bg-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}
.bg-fld{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.bg-fld input,.bg-fld select,.bg-fld textarea{width:100%;color:var(--fg);font:14px var(--font);padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.bg-fld textarea{min-height:60px;resize:vertical}
.bg-rows{display:grid;gap:10px;margin:12px 0}
.bg-row{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;border-top:1px dashed var(--line);padding-top:10px}
.bg-row:first-child{border-top:0;padding-top:0}
.bg-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--hover);color:var(--accent);font-weight:600}
.bg-row.on .bg-n{background:var(--accent);color:var(--accent-fg)}
.bg-rb{display:grid;gap:6px;min-width:0}
.bg-pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.bg-pick b{color:var(--fg)}
.bg-cls{border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;gap:6px;background:var(--bg)}
.bg-yr{display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px;align-items:start}
.bg-yl{background:none;border:0;padding:5px 0;text-align:left;font:600 12.5px var(--font);color:var(--accent);cursor:pointer}
.bg-chips{display:flex;flex-wrap:wrap;gap:4px}
.bg-chip{min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font:13px var(--font)}
.bg-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.bg-msg{border-radius:4px;padding:7px 10px;font-size:13px;margin:0 0 10px}
.bg-msg.ok{background:color-mix(in srgb,var(--ok) 15%,var(--panel));color:var(--ok);font-weight:600}
.bg-msg.bad{background:color-mix(in srgb,var(--warn) 12%,var(--panel));color:var(--warn);font-weight:600}
.bg-msg.info{background:var(--hover);color:var(--muted)}
.bg-pills{display:flex;flex-wrap:wrap;gap:5px}
.bg-pills button{border:1px solid var(--line);border-radius:999px;background:var(--hover);color:var(--fg);padding:3px 10px;font:12.5px var(--font);cursor:pointer}
.bg-k{color:var(--muted);font-size:12px}
.bg-diff{font-size:12.5px;margin:2px 0}
.bg-diff .add{color:var(--warn)}.bg-diff .miss{color:#b26a00}
@media (max-width:640px){.bg-two{grid-template-columns:minmax(0,1fr)}.bg-yr{grid-template-columns:minmax(0,1fr)}}`;
document.head.appendChild(st);

ICON.borang='<rect x="6" y="3" width="16" height="22" rx="2" fill="#fff" stroke="#3b6fb8" stroke-width="1.6"/><path d="M10 9h8M10 13h8M10 17h5" stroke="#3b6fb8" stroke-width="1.6"/><path d="M17 20l2 2 4-5" fill="none" stroke="#5fa86b" stroke-width="2"/>';
const addBtn=(g,after)=>{const i=g.findIndex(x=>x&&x[0]===after);g.splice(i<0?g.length:i+1,0,['v:borang','Borang'])};
addBtn(GROUPS.utama,'v:guru');addBtn(GROUPS.spec,'v:guru');

const B={tab:'isi',view:'guru',guru:'',guruLain:'',rows:null,catatan:'',dirty:false,msg:'',all:{},ready:false,db:null,swArm:0};
const blank=()=>Array.from({length:N},()=>({sub:'',lain:'',kelas:[],open:false}));
B.rows=blank();
const subName=c=>{const s=subj(c);return s?s.name:c};
const subLabel=c=>{const s=subj(c);return s?(s.name&&s.name!==c?s.name+' ('+c+')':c):c};
const clsOrder=n=>{const i=D.classes.findIndex(c=>c.name===n);return i<0?999:i};
const sortCls=a=>[...new Set(a)].sort((x,y)=>clsOrder(x)-clsOrder(y));
const docId=s=>String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,120)||'_';
const slug=s=>'x-'+String(s).toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80);
const fmt=ts=>{const d=new Date(ts);return d.toLocaleDateString('ms-MY',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'})};
const curId=()=>B.guru===LAIN?(B.guruLain.trim()?slug(B.guruLain):''):(B.guru?docId(B.guru):'');
const rowName=r=>r.sub===LAIN?r.lain.trim():r.sub;
const yearsOf=()=>{const m=new Map();D.classes.forEach((c,i)=>{const y=yearOf(i),k=y==null?'Lain':yearTxt(y);if(!m.has(k))m.set(k,[]);m.get(k).push(c.name)});return[...m.entries()]};
let oleh='';try{oleh=localStorage.getItem(OLEH)||''}catch(e){}

function loadRec(){
  const d=B.all[curId()];B.rows=blank();B.catatan='';
  if(d){B.catatan=d.catatan||'';(d.subjek||[]).slice(0,N).forEach((s,i)=>{const known=s.kod&&subj(s.kod);
    B.rows[i]={sub:known?s.kod:LAIN,lain:known?'':(s.nama||s.kod||''),kelas:sortCls((s.kelas||[]).filter(n=>clsOrder(n)<999)),open:false}})}
  B.dirty=false;
}
function subOpts(sel){
  const list=D.subjects.filter(s=>!NOTEACH.includes(s.code)).slice().sort((a,b)=>subLabel(a.code).localeCompare(subLabel(b.code)));
  return'<option value="">Pilih subjek</option>'+list.map(s=>`<option value="${esc(s.code)}"${s.code===sel?' selected':''}>${esc(subLabel(s.code))}</option>`).join('')+`<option value="${LAIN}"${sel===LAIN?' selected':''}>Lain-lain (tulis sendiri)</option>`;
}
function formHtml(){
  const id=curId(),d=B.all[id],ce=B.db&&CANW!==false;
  const rec=!id?'':d?`<p class="bg-msg info">Rekod sedia ada. Dikemas kini ${esc(fmt(d.dihantar))}${d.oleh?' oleh <b>'+esc(d.oleh)+'</b>':''}.</p>`:'<p class="bg-msg info">Guru ini belum ada rekod borang.</p>';
  const rows=B.rows.map((r,i)=>{const on=!!rowName(r),n=r.kelas.length;
    const cls=r.open?`<div class="bg-cls">${yearsOf().map(([yl,list],yi)=>`<div class="bg-yr"><button type="button" class="bg-yl" data-bgyr="${i}|${yi}" title="Tekan untuk pilih atau buang semua kelas ${esc(yl)}">${esc(yl)} ☑</button><div class="bg-chips">${list.map(c=>`<button type="button" class="bg-chip" data-bgc="${i}|${esc(c)}" aria-pressed="${r.kelas.includes(c)}">${esc(c.replace(/^(PRA|\d+)\s+/i,''))}</button>`).join('')}</div></div>`).join('')}
      <div class="bar" style="margin:0"><button type="button" class="btn pri" data-bgdone="${i}">Selesai</button><button type="button" class="btn" data-bgall="${i}">Pilih semua kelas</button><button type="button" class="btn" data-bgclr="${i}"${n?'':' disabled'}>Buang semua kelas</button></div></div>`:'';
    return`<div class="bg-row${on?' on':''}"><div class="bg-n" aria-hidden="true">${i+1}</div><div class="bg-rb">
      <select data-bgsub="${i}" aria-label="Subjek ${i+1}">${subOpts(r.sub)}</select>
      ${r.sub===LAIN?`<input type="text" data-bglain="${i}" value="${esc(r.lain)}" placeholder="Nama subjek" aria-label="Nama subjek lain" style="font:14px var(--font);padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg)">`:''}
      <div class="bg-pick"><button type="button" class="btn" data-bgopen="${i}" aria-expanded="${r.open}"${on?'':' disabled'}>${r.open?'Tutup kelas':'Pilih kelas'}</button>
      ${on&&i>0&&B.rows[i-1].kelas.length?`<button type="button" class="btn" data-bgcopy="${i}">Kelas sama seperti subjek ${i}</button>`:''}<span>${n?'<b>'+n+' kelas:</b> '+esc(r.kelas.join(', ')):(on?'Belum pilih kelas':'')}</span></div>${cls}</div></div>`}).join('');
  return`${B.msg}<div class="bg-two"><label class="bg-fld">Diisi oleh<input type="text" id="bg-oleh" value="${esc(oleh)}" placeholder="Nama ketua panitia"></label>
    <label class="bg-fld">Guru<select id="bg-guru"><option value="">Pilih guru</option>${D.teachers.map(t=>`<option value="${esc(t.code)}"${t.code===B.guru?' selected':''}>${esc(t.name)} (${esc(t.code)})${B.all[docId(t.code)]?' ✓':''}</option>`).join('')}<option value="${LAIN}"${B.guru===LAIN?' selected':''}>Nama tiada dalam senarai</option></select>
    ${B.guru===LAIN?`<input type="text" id="bg-guru-lain" value="${esc(B.guruLain)}" placeholder="Tulis nama penuh guru">`:''}</label></div>
    <div style="margin-top:10px">${rec}</div>
    <p class="note" style="margin:0">Pilih subjek, tekan Pilih kelas, kemudian sentuh kelas. Jimat masa: tekan nama tahun (☑) untuk pilih semua kelas tahun itu, Pilih semua kelas untuk semua kelas sekali gus, atau Kelas sama seperti subjek di atas untuk salin kelas daripada subjek sebelumnya. Biarkan ruang yang tidak perlu kosong.</p>
    <div class="bg-rows">${rows}</div>
    <label class="bg-fld">Catatan (pilihan)<textarea id="bg-cat" placeholder="Contoh: boleh mengajar Pendidikan Jasmani jika perlu">${esc(B.catatan)}</textarea></label>
    <div class="bar" style="margin-top:12px"><button type="button" class="btn pri" data-bga="save"${ce?'':' disabled'}>${d?'Simpan perubahan':'Simpan'}</button><button type="button" class="btn" data-bga="clear">Kosongkan</button><span class="grow"></span>${d?'<button type="button" class="btn dng" data-bga="del"'+(ce?'':' disabled')+'>Padam rekod guru ini</button>':''}</div>
    ${B.db?(ce?'':'<p class="note">Anda hanya boleh melihat. Minta akses yang membolehkan anda mengisi daripada pemilik halaman.</p>'):'<p class="note">Borang hanya boleh disimpan dalam halaman Claude yang dikongsi, semasa log masuk.</p>'}`;
}
function recs(){return Object.keys(B.all).map(k=>({...B.all[k],_id:k})).sort((a,b)=>String(a.guru).localeCompare(String(b.guru)))}
/* What the timetable actually has for one teacher: subject code -> set of class names. */
function actual(code){const t=tIdx(code),m={};if(t<0)return m;
  D.lessons.forEach(l=>{if(l[0]!==t||NOTEACH.includes(l[3]))return;(m[l[3]]=m[l[3]]||new Set());l[4].forEach(c=>{if(D.classes[c])m[l[3]].add(D.classes[c].name)})});return m}
function diffFor(d){
  if(!d.kod||tIdx(d.kod)<0)return null;
  const act=actual(d.kod),form={};(d.subjek||[]).forEach(s=>{if(s.kod&&subj(s.kod))(form[s.kod]=form[s.kod]||new Set());(s.kelas||[]).forEach(c=>s.kod&&form[s.kod]&&form[s.kod].add(c))});
  const add=[],miss=[];
  Object.keys(form).forEach(k=>{const a=act[k]||new Set();const x=[...form[k]].filter(c=>!a.has(c));if(x.length)add.push(k+': '+sortCls(x).join(', '))});
  Object.keys(act).forEach(k=>{const f=form[k]||new Set();const x=[...act[k]].filter(c=>!f.has(c));if(x.length)miss.push(k+': '+sortCls(x).join(', '))});
  return{add,miss}
}
function listHtml(){
  const rows=recs(),belum=D.teachers.filter(t=>!B.all[docId(t.code)]),seg=(k,l)=>`<button data-bgview="${k}" aria-pressed="${B.view===k}">${l}</button>`;
  let h=`<div class="bar"><div class="seg" role="group" aria-label="Susunan">${seg('guru','Ikut guru')}${seg('subjek','Ikut subjek')}${seg('banding','Banding jadual')}</div><span class="grow"></span>
    <span class="pill">${D.teachers.filter(t=>B.all[docId(t.code)]).length} / ${D.teachers.length} guru diisi</span>
    <button type="button" class="btn" data-bga="csv"${rows.length?'':' disabled'}>Muat turun CSV</button></div>`;
  if(!rows.length)return h+'<p class="bg-msg info">Belum ada rekod. Pilih Isi / ubah untuk mula mengisi.</p>'+belumHtml(belum);
  const sl=s=>s.kod&&subj(s.kod)?subLabel(s.kod):(s.nama||s.kod||'');
  if(B.view==='guru')h+=`<div class="tw"><table><thead><tr><th>Guru</th><th>Subjek dan kelas</th><th>Diisi oleh</th><th></th></tr></thead><tbody>${rows.map(d=>`<tr><td><b>${esc(d.guru)}</b><br><span class="bg-k">${esc(d.kod||'Tiada kod')}</span></td><td>${(d.subjek||[]).map(s=>`<div><b>${esc(sl(s))}</b> <span class="bg-k">${esc((s.kelas||[]).join(', '))}</span></div>`).join('')}${d.catatan?`<div class="bg-k"><i>${esc(d.catatan)}</i></div>`:''}</td><td>${esc(d.oleh||'')}<br><span class="bg-k">${d.dihantar?esc(fmt(d.dihantar)):''}</span></td><td><button type="button" class="btn" data-bgedit="${esc(d._id)}">Ubah</button></td></tr>`).join('')}</tbody></table></div>`;
  else if(B.view==='subjek'){const m={};rows.forEach(d=>(d.subjek||[]).forEach(s=>{const k=sl(s);(m[k]=m[k]||[]).push({d,kelas:s.kelas||[]})}));
    h+=Object.keys(m).sort().map(k=>`<h3 style="font-size:14px;margin:12px 0 6px">${esc(k)} <span class="bg-k">· ${m[k].length} guru</span></h3><div class="tw"><table><tbody>${m[k].map(x=>`<tr><td style="width:42%"><b>${esc(x.d.guru)}</b> <span class="bg-k">${esc(x.d.kod)}</span></td><td>${esc(x.kelas.join(', '))}</td><td style="width:1%"><button type="button" class="btn" data-bgedit="${esc(x.d._id)}">Ubah</button></td></tr>`).join('')}</tbody></table></div>`).join('')}
  else{const ce=canEdit();
    h+=`<p class="note" style="margin:0 0 8px">Banding borang dengan jadual sekarang. <span style="color:var(--warn)">Merah</span>: ada dalam borang, belum ada dalam jadual. <span style="color:#b26a00">Jingga</span>: ada dalam jadual, tiada dalam borang. Perhimpunan dan BY tidak dikira.</p>
    <div class="tw"><table><thead><tr><th>Guru</th><th>Perbezaan</th><th>Pelajaran guru (data Guru)</th><th></th></tr></thead><tbody>${rows.map(d=>{const df=diffFor(d),t=tIdx(d.kod);
      if(!df)return`<tr><td><b>${esc(d.guru)}</b></td><td colspan="3" class="bg-k">Guru ini tiada dalam senarai Guru jadual.</td></tr>`;
      const codes=[...new Set((d.subjek||[]).map(s=>s.kod).filter(k=>k&&subj(k)))],cur=D.teachers[t].subs||[],same=codes.every(c=>cur.includes(c))&&cur.filter(c=>!NOTEACH.includes(c)).every(c=>codes.includes(c));
      return`<tr><td><b>${esc(d.guru)}</b><br><span class="bg-k">${esc(d.kod)}</span></td><td>${!df.add.length&&!df.miss.length?'<span class="ok">Sepadan</span>':df.add.map(x=>`<div class="bg-diff add">+ ${esc(x)}</div>`).join('')+df.miss.map(x=>`<div class="bg-diff miss">− ${esc(x)}</div>`).join('')}</td>
        <td>${esc(cur.join(', '))}${same?'':'<br><span class="bg-k">Borang: '+esc(codes.join(', '))+'</span>'}</td><td>${same?'':`<button type="button" class="btn" data-bgapply="${esc(d._id)}"${ce?'':' disabled'}>Guna subjek borang</button>`}</td></tr>`}).join('')}</tbody></table></div>
    <p class="note">Guna subjek borang menetapkan senarai Pelajaran guru itu (dalam Spesifikasi &gt; Guru) mengikut borang. Perhimpunan dan BY dikekalkan. Waktu dalam jadual tidak diubah.</p>`}
  return h+belumHtml(belum);
}
function belumHtml(belum){return`<h3 style="font-size:14px;margin:14px 0 6px">Belum diisi (${belum.length})</h3>`+(belum.length?`<div class="bg-pills">${belum.map(t=>`<button type="button" data-bgedit="${esc(docId(t.code))}" data-bgcode="${esc(t.code)}">${esc(t.name)}</button>`).join('')}</div>`:'<p class="ok">Semua guru sudah diisi.</p>')}
function borangView(){
  const sg=(k,l)=>`<button data-bgtab="${k}" aria-pressed="${B.tab===k}">${l}</button>`;
  return`<div class="bar"><div class="seg" role="group" aria-label="Borang">${sg('isi','Isi / ubah')}${sg('senarai','Senarai')}</div><span class="grow"></span><span class="note" style="margin:0">Borang Subjek Guru 2027 · diisi oleh ketua panitia</span></div>`+(B.tab==='isi'?formHtml():listHtml());
}
function guruSec(){let f=formHtml();if(!B.guru)f=f.split('<div style="margin-top:10px">')[0];return`<section class="sec" id="bg-gsec" style="margin:0 0 14px;border:2px solid var(--accent);border-radius:6px;padding:10px 12px;background:var(--hover)"><h2 class="sech" style="margin:0 0 4px">Edit subjek dan kelas yang diajar</h2><p class="note" style="margin:0 0 8px">Pilih guru dalam kotak <b>Guru</b> di bawah (atau klik nama guru dalam senarai), kemudian ubah subjek dan kelasnya, dan tekan Simpan.</p>${f}</section>`}
function draw(){if(S.preview)return;if(S.view==='borang'){main.innerHTML=borangView()}else if(S.view==='guru'){const y=window.scrollY;render();window.scrollTo(0,y)}}
const _render=render;
render=function(){if(S.view==='borang'&&!S.preview){ribbon();document.body.classList.remove('pv');main.innerHTML=borangView();return}_render();if(S.view==='guru'&&!S.preview)main.insertAdjacentHTML('afterbegin',guruSec())};
const msg=(cls,t)=>{B.msg=t?`<p class="bg-msg ${cls}" role="${cls==='bad'?'alert':'status'}">${t}</p>`:''};
function openFor(id,code){
  const d=B.all[id];
  if(code||D.teachers.some(t=>docId(t.code)===id)){B.guru=code||D.teachers.find(t=>docId(t.code)===id).code;B.guruLain=''}
  else if(d){B.guru=LAIN;B.guruLain=d.guru}
  msg('','');loadRec();B.tab='isi';draw();window.scrollTo(0,main.offsetTop-10);
}
main.addEventListener('click',async e=>{
  if((S.view!=='borang'&&S.view!=='guru')||S.preview)return;
  if(S.view==='guru'){const tr=e.target.closest('tr.row');if(tr){const t=D.teachers[+tr.dataset.i];if(t&&!(B.dirty&&B.guru!==t.code)){B.guru=t.code;B.guruLain='';msg('','');loadRec();draw()}return}}
  const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
  if(ds.bgtab){B.tab=ds.bgtab;draw();return}
  if(ds.bgview){B.view=ds.bgview;draw();return}
  if(ds.bgedit){openFor(ds.bgedit,ds.bgcode);return}
  if(ds.bgopen!=null){const i=+ds.bgopen;B.rows.forEach((r,j)=>r.open=j===i?!r.open:false);draw();return}
  if(ds.bgdone!=null){B.rows[+ds.bgdone].open=false;draw();return}
  if(ds.bgclr!=null){B.rows[+ds.bgclr].kelas=[];B.dirty=true;draw();return}
  if(ds.bgall!=null){B.rows[+ds.bgall].kelas=sortCls(D.classes.map(c=>c.name));B.dirty=true;draw();return}
  if(ds.bgcopy!=null){const i=+ds.bgcopy;B.rows[i].kelas=B.rows[i-1].kelas.slice();B.rows.forEach(x=>x.open=false);B.dirty=true;draw();return}
  if(ds.bgc){const[i,c]=[+ds.bgc.split('|')[0],ds.bgc.slice(ds.bgc.indexOf('|')+1)],r=B.rows[i];r.kelas=r.kelas.includes(c)?r.kelas.filter(x=>x!==c):sortCls([...r.kelas,c]);B.dirty=true;draw();return}
  if(ds.bgyr){const[i,yi]=ds.bgyr.split('|').map(Number),r=B.rows[i],list=yearsOf()[yi][1],all=list.every(c=>r.kelas.includes(c));
    r.kelas=all?r.kelas.filter(c=>!list.includes(c)):sortCls([...r.kelas,...list]);B.dirty=true;draw();return}
  if(ds.bgapply){const d=B.all[ds.bgapply],t=tIdx(d&&d.kod);if(!d||t<0||!canEdit())return;
    const codes=[...new Set((d.subjek||[]).map(s=>s.kod).filter(k=>k&&subj(k)))],keep=(D.teachers[t].subs||[]).filter(c=>NOTEACH.includes(c));
    D.teachers[t].subs=[...keep,...codes.filter(c=>!keep.includes(c))];persist();toast('Pelajaran '+D.teachers[t].code+' dikemas kini');draw();return}
  const a=ds.bga;if(!a)return;
  if(a==='clear'){if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Ya, kosongkan';setTimeout(()=>{if(b.isConnected){b.dataset.arm='';b.textContent='Kosongkan'}},3500);return}
    B.rows=blank();B.catatan='';B.dirty=true;msg('','');draw();return}
  if(a==='del'){if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Ya, padam rekod';setTimeout(()=>{if(b.isConnected){b.dataset.arm='';b.textContent='Padam rekod guru ini'}},3500);return}
    try{await B.db.doc('borang/'+curId()).delete();delete B.all[curId()];loadRec();msg('ok','Rekod dipadam.');toast('Rekod dipadam')}catch(err){msg('bad','Tidak dapat memadam. Cuba lagi.')}draw();return}
  if(a==='csv'){const rows=recs(),q=v=>{v=String(v==null?'':v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    const hd=['Nama guru','Kod'];for(let i=1;i<=N;i++)hd.push('Subjek '+i,'Kelas '+i);hd.push('Catatan','Diisi oleh','Dikemas kini');
    const out=[hd.map(q).join(',')];rows.forEach(d=>{const r=[d.guru,d.kod];for(let i=0;i<N;i++){const s=(d.subjek||[])[i];r.push(s?(s.kod&&subj(s.kod)?subLabel(s.kod):s.nama||s.kod):'',s?(s.kelas||[]).join(' / '):'')}r.push(d.catatan||'',d.oleh||'',d.dihantar?new Date(d.dihantar).toLocaleString('ms-MY'):'');out.push(r.map(q).join(','))});
    try{const dl=await window.claude.use('downloads');if(!dl){toast('Muat turun tidak tersedia di sini');return}await dl.save({filename:'borang-subjek-guru-2027.csv',data:'﻿'+out.join('\r\n')})}catch(err){if(!(err&&err.code==='declined'))toast('Muat turun tidak berjaya')}return}
  if(a==='save'){
    let nama='',kod='';const id=curId();
    if(B.guru===LAIN)nama=B.guruLain.trim();else if(B.guru){const t=D.teachers[tIdx(B.guru)];if(t){nama=t.name;kod=t.code}}
    if(!nama){msg('bad','Pilih guru dahulu.');draw();return}
    if(!oleh.trim()){msg('bad','Tulis nama anda di ruang Diisi oleh.');draw();const o=document.getElementById('bg-oleh');if(o)o.focus();return}
    const subjek=[],noCls=[];B.rows.forEach((r,i)=>{const n=rowName(r);if(!n)return;if(!r.kelas.length)noCls.push(i+1);subjek.push(r.sub===LAIN?{kod:'',nama:n,kelas:r.kelas.slice()}:{kod:r.sub,nama:subName(r.sub),kelas:r.kelas.slice()})});
    if(!subjek.length){msg('bad','Isi sekurang-kurangnya satu subjek.');draw();return}
    if(noCls.length){msg('bad','Pilih kelas untuk subjek '+noCls.join(', ')+'.');draw();return}
    b.disabled=true;b.textContent='Menyimpan…';
    const data={guru:nama,kod,subjek,catatan:B.catatan.trim(),oleh:oleh.trim(),dihantar:Date.now()};
    try{await B.db.doc('borang/'+id).set(data);B.all[id]=data;B.dirty=false;if(kod&&canEdit()){const ti=tIdx(kod);if(ti>=0){const codes=[...new Set(subjek.map(x=>x.kod).filter(k=>k&&subj(k)))],keep=(D.teachers[ti].subs||[]).filter(c=>NOTEACH.includes(c));D.teachers[ti].subs=[...keep,...codes.filter(c=>!keep.includes(c))];persist()}}msg('ok','Disimpan untuk '+esc(nama)+'. Pilih guru seterusnya, atau ubah lagi jika perlu.');toast('Borang disimpan')}
    catch(err){msg('bad',err&&(err.code==='permission_denied'||err.code==='not_granted'||err.code==='invalid_argument')?'Anda belum diberi akses untuk menyimpan. Minta pemilik halaman berkongsi halaman ini dengan anda sebagai pengguna yang boleh mengisi.':'Tidak dapat disimpan. Semak sambungan internet dan cuba lagi.')}
    draw();return}
});
main.addEventListener('change',e=>{
  if((S.view!=='borang'&&S.view!=='guru')||S.preview)return;const t=e.target;
  if(t.id==='bg-guru'){
    if(B.dirty&&Date.now()-B.swArm>4000){B.swArm=Date.now();t.value=B.guru;msg('bad','Perubahan untuk guru ini belum disimpan. Pilih guru lain sekali lagi untuk teruskan tanpa menyimpan.');draw();return}
    B.guru=t.value;B.guruLain='';msg('','');loadRec();if(S.view==='guru'){const ti=tIdx(B.guru);S.sel.guru=ti}draw();if(B.guru===LAIN){const g=document.getElementById('bg-guru-lain');if(g)g.focus()}return}
  if(t.dataset.bgsub!=null){const i=+t.dataset.bgsub,r=B.rows[i];r.sub=t.value;if(t.value!==LAIN)r.lain='';if(!t.value){r.kelas=[];r.open=false}else if(!r.kelas.length){B.rows.forEach(x=>x.open=false);r.open=t.value!==LAIN}B.dirty=true;draw();
    const f=main.querySelector(t.value===LAIN?`[data-bglain="${i}"]`:`[data-bgsub="${i}"]`);if(f)f.focus();return}
  if(t.id==='bg-guru-lain'){if(B.all[curId()]){loadRec();draw()}}
});
main.addEventListener('input',e=>{
  if((S.view!=='borang'&&S.view!=='guru')||S.preview)return;const t=e.target;
  if(t.id==='bg-oleh'){oleh=t.value;try{localStorage.setItem(OLEH,oleh)}catch(err){}return}
  if(t.id==='bg-guru-lain'){B.guruLain=t.value;return}
  if(t.id==='bg-cat'){B.catatan=t.value;B.dirty=true;return}
  if(t.dataset.bglain!=null){const i=+t.dataset.bglain;B.rows[i].lain=t.value;B.dirty=true;const row=t.closest('.bg-row'),o=row&&row.querySelector('[data-bgopen]');if(row)row.classList.toggle('on',!!t.value.trim());if(o)o.disabled=!t.value.trim()}
});
const hb=document.getElementById('borangBuka');
if(hb)hb.addEventListener('click',()=>{S.preview=null;S.view='borang';render();window.scrollTo(0,0)});
(async()=>{
  try{if(!window.claude||!window.claude.use)return;const db=await window.claude.use('db');if(!db)return;B.db=db;
    db.collection('borang').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});B.all=m;B.ready=true;
      if(!B.dirty&&curId())loadRec();
      const ae=document.activeElement;if((S.view==='borang'||S.view==='guru')&&!S.preview&&!(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&main.contains(ae)))draw()},()=>{});
    if(S.view==='borang')draw();
  }catch(e){}
})();
})();
</script>

<style>
.gkmenu{position:fixed;z-index:1000;background:var(--panel,#fff);color:var(--fg,#1b2430);border:1px solid var(--line,#c8d3e3);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:12px;width:340px;max-width:calc(100vw - 16px);box-sizing:border-box}
.gkmenu .gkh{font-weight:700;margin-bottom:8px}
.gkmenu label{display:block;font-size:13px;color:var(--muted,#5b6778);margin-bottom:8px}
.gkmenu select{display:block;width:100%;margin-top:4px;font:inherit;font-size:14px;padding:6px;border:1px solid var(--line,#c8d3e3);border-radius:6px;background:var(--bg,#fff);color:var(--fg,#1b2430)}
.gkmenu .gka{display:flex;gap:8px;margin-top:4px}
</style>
<script>
/* Klik kanan (atau tekan lama) pada baris kelas untuk memilih guru kelas dan pembantu dengan cepat. */
(()=>{const mainEl=document.getElementById('main');
function close(){const m=document.getElementById('gkmenu');if(m)m.remove()}
document.addEventListener('mousedown',e=>{const m=document.getElementById('gkmenu');if(m&&!m.contains(e.target))close()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
mainEl.addEventListener('contextmenu',e=>{
  if(S.view!=='kelas'||S.preview)return;const tr=e.target.closest('tr.row');if(!tr)return;
  e.preventDefault();close();
  if(!canEdit()){toast('Anda hanya boleh melihat');return}
  const i=+tr.dataset.i,c=D.classes[i];if(!c)return;
  const role=code=>{const r=[];D.classes.forEach((x,j)=>{if(j===i)return;if(x.guru===code)r.push('GK '+x.name);if(x.pgk===code)r.push('P '+x.name)});return r};
  const opt=sel=>'<option value="">(tiada)</option>'+D.teachers.map(t=>{const r=role(t.code);return`<option value="${esc(t.code)}" ${sel===t.code?'selected':''}>${esc(t.name)}${r.length?' · '+esc(r.join(', ')):''}</option>`}).join('');
  const m=document.createElement('div');m.id='gkmenu';m.className='gkmenu';m.setAttribute('role','dialog');m.setAttribute('aria-label','Guru kelas '+c.name);
  m.innerHTML=`<div class="gkh">${esc(c.name)}</div><label>Guru kelas<select data-k="guru">${opt(c.guru||'')}</select></label><label>Pembantu guru kelas<select data-k="pgk">${opt(c.pgk||'')}</select></label><div class="gka"><button type="button" class="btn pri" data-gk="ok">Simpan</button><button type="button" class="btn" data-gk="x">Batal</button></div>`;
  document.body.appendChild(m);
  const W=m.offsetWidth,H=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(e.clientX,innerWidth-W-8))+'px';m.style.top=Math.max(8,Math.min(e.clientY,innerHeight-H-8))+'px';
  m.querySelector('select').focus();
  m.addEventListener('click',ev=>{const b=ev.target.closest('[data-gk]');if(!b)return;
    if(b.dataset.gk==='ok'){const g=m.querySelector('[data-k=guru]').value,p=m.querySelector('[data-k=pgk]').value;
      D.classes[i]={...D.classes[i],guru:g,pgk:p};persist();toast('Disimpan: '+c.name);close();render()}
    else close()});
});
})();
</script>
