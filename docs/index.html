/* Pairs of lessons of one teacher at different waktu whose real times overlap (only possible with the Year 1 shift). */
function halfClashes(){
  const by={},out=[];
  D.lessons.forEach((l,i)=>{const k=l[0]+','+l[1];(by[k]=by[k]||[]).push({i,p:l[2],...lessonTime(l[2],l[4])})});
  Object.values(by).forEach(a=>{for(let x=0;x<a.length;x++)for(let y=x+1;y<a.length;y++){const A=a[x],B=a[y];
    if(A.p!==B.p&&A.s<B.e&&B.s<A.e)out.push([A.i,B.i])}});
  return out}

/* Lessons are stored as [teacherIndex, day, periodIndex, subjectCode, [classIndex...]] (from the school's aSc export). */
function build(){
  const tch=D.teachers.map(()=>DAYS.map(()=>PER.map(()=>[])));
  const cls=D.classes.map(()=>DAYS.map(()=>PER.map(()=>[])));
  for(const[t,d,p,sub,cs]of D.lessons||[]){
    if(!tch[t])continue;
    tch[t][d][p].push({sub,cls:cs});
    cs.forEach(c=>{if(cls[c])cls[c][d][p].push({t,sub})});
    /* Assembly (PER) has no class on the teacher sheet; show it on the class teacher's own class. */
    if(!cs.length&&sub==='PER')D.classes.forEach((c,ci)=>{if(c.guru&&c.guru===D.teachers[t].code)cls[ci][d][p].push({t,sub})})}
  const half=new Set();halfClashes().forEach(pr=>pr.forEach(i=>{const l=D.lessons[i];half.add(l[0]+','+l[1]+','+l[2])}));
  return{cls,tch,half};
}

  if(v==='guru')D.lessons=D.lessons.filter(l=>l[0]!==x).map(l=>[l[0]>x?l[0]-1:l[0],l[1],l[2],l[3],l[4]]);

}

/* ---------- Relif gaya aSc Jadual Ganti: senarai guru tidak hadir, jadual penggantian, panel calon guru ---------- */
/* D.cuti = [{code,dari,hingga,sebab,julat}] guru tidak hadir beberapa hari

  abs.forEach(t=>PER.forEach((_,pi)=>{if(!arIn(t,pi))return;G.tch[t][d][pi].forEach(e=>{if(!e.cls.length||e.sub==='PER'||e.sub==='BY')return;e.cls.forEach(c=>{

function arBusy(G,d,abs){const P=S.arPick||{},busy=D.teachers.map(()=>PER.map(()=>0)),sub=D.teachers.map(()=>PER.map(()=>0)),freed=D.teachers.map(()=>PER.map(()=>0));

function slotWarn(d,p,t,sub,cs){
  const w=[];
  D.lessons.forEach(l=>{if(l[1]!==d||l[2]!==p)return;
    if(l[0]===t)w.push(`${D.teachers[t].name} sudah mengajar ${l[3]} pada waktu ini`);
    else cs.forEach(c=>{if(l[4].includes(c)&&l[3]!==sub)w.push(`${D.classes[c].name} sudah ada ${l[3]} pada waktu ini`)})});
  const tm=lessonTime(p,cs);
  D.lessons.forEach(l=>{if(l[0]!==t||l[1]!==d||l[2]===p)return;const o=lessonTime(l[2],l[4]);
    if(o.s<tm.e&&tm.s<o.e)w.push(`${D.teachers[t].name} mengajar ${l[3]} ${l[4].map(c=>D.classes[c].name).join(', ')} ${tmTxt(o)}, bertindih dengan ${tmTxt(tm)}`)});
  return[...new Set(w)];
}

function groupCheck(G,g){

    if(miss.length){const[d,p]=k.split(',').map(Number);bad.push({d,p,miss:miss.map(c=>D.classes[c].name),n:g.cls.length-miss.length})}});
  bad.sort((a,b)=>a.d-b.d||a.p-b.p);

function tasPlan(c){
  const G=build(),idx=[];
  D.lessons.forEach((l,i)=>{if(l[3]==='TAS'&&l[4].includes(c))idx.push(i)});
  if(!idx.length)return null;
  const multi=idx.some(i=>D.lessons[i][4].length>1);
  const d0=D.lessons[idx[0]][1],ps=[...new Set(idx.map(i=>D.lessons[i][2]))].sort((a,b)=>a-b);
  const n=ps.length,cur=DAYS[d0]+' waktu '+(ps[0]+1)+(n>1?'-'+(ps[n-1]+1):'');
  const last=d=>{let e=-1;PER.forEach((_,p)=>{if(G.cls[c][d][p].length)e=p});return e};
  if(multi)return{c,cur,idx,msg:'TAS dikongsi beberapa kelas, atur sendiri.',ok:false};
  if(ps.some((p,k)=>k&&p!==ps[k-1]+1)||idx.some(i=>D.lessons[i][1]!==d0))return{c,cur,idx,msg:'TAS tidak dalam satu blok, atur sendiri.',ok:false};
  const opts=[];
  for(let d=0;d<DAYS.length;d++){
    const e=last(d);if(e-n+1<0)continue;
    const t0=e-n+1,sw=[],prob=[];
    if(d===d0&&t0===ps[0]){opts.push({d,t0,already:true,prob:[],sw:[]});continue}
    const tIdx=new Set(idx);
    /* occupants of the class at target (not TAS) swap into TAS's old slots */
    D.lessons.forEach((l,i)=>{if(tIdx.has(i)||l[1]!==d||!l[4].includes(c)||l[2]<t0||l[2]>e)return;
      if(l[4].length>1)prob.push(l[3]+' dikongsi kelas lain');else sw.push(i)});
    /* if the target overlaps the old TAS slots on the same day, skip the swap for those */
    const mv=idx.map(i=>[i,D.lessons[i][0],d,D.lessons[i][2]-ps[0]+t0]);
    const busy=(t,dd,pp,ign)=>D.lessons.some((m,j)=>!ign.has(j)&&m[0]===t&&m[1]===dd&&m[2]===pp);
    const ign=new Set([...tIdx,...sw]);
    mv.forEach(([i,t,dd,pp])=>{if(busy(t,dd,pp,ign))prob.push(D.teachers[t].name+' sibuk');});
    sw.forEach(i=>{const l=D.lessons[i],np=ps[0]+(l[2]-t0);
      if(busy(l[0],d0,np,ign))prob.push(D.teachers[l[0]].name+' sibuk di waktu ganti')});
    opts.push({d,t0,prob:[...new Set(prob)],sw,mv});
  }
  const al=opts.find(o=>o.already);
  if(al)return{c,cur,idx,already:true,ok:true,msg:'Sudah di waktu akhir.'};
  const good=opts.filter(o=>!o.prob.length).sort((a,b)=>(a.d===d0?0:1)-(b.d===d0?0:1)||a.d-b.d)[0];
  if(!good)return{c,cur,idx,ok:false,msg:'Tiada hari tanpa pertindihan.'};
  const to=DAYS[good.d]+' waktu '+(good.t0+1)+(n>1?'-'+(good.t0+n):'');
  return{c,cur,idx,ok:true,opt:good,ps,d0,to,msg:'Cadangan: '+to+(good.sw.length?' (tukar dengan '+good.sw.length+' waktu lain)':'')};
}

/* ---------- Bilangan waktu setiap kelas ---------- */
function bilPat(keys){
  const a=[...keys].map(k=>k.split(',').map(Number)).sort((x,y)=>x[0]-y[0]||x[1]-y[1]),r=[];let run=0,pd=-9,pp=-9;
  a.forEach(([d,p])=>{if(d===pd&&p===pp+1)run++;else{if(run)r.push(run);run=1}pd=d;pp=p});if(run)r.push(run);
  return r.sort((x,y)=>y-x);
}
function bilParse(t){t=String(t||'').replace(/\s/g,'');if(!/^\d+(\+\d+)*$/.test(t))return null;return t.split('+').map(Number).sort((a,b)=>b-a)}
/* rearrange the cells of one subject in a class into blocks of the wanted sizes */
function bilSplit(c,sub,sizes){
  const G=build(),grid=bilGrid(c,G);
  const mine=D.lessons.map((l,i)=>[l,i]).filter(([l])=>l[3]===sub&&l[4].includes(c));
  const sold=new Set(mine.map(([l])=>l[1]+','+l[2]));
  if(sold.size!==sizes.reduce((a,b)=>a+b,0))return{ok:false,msg:'jumlah pecahan tidak sama dengan bilangan waktu'};
  if(bilPat(sold).join('+')===sizes.join('+'))return{ok:true,same:true};
  if(mine.some(([l])=>l[4].length>1))return{ok:false,msg:'dikongsi kelas lain, atur sendiri'};
  const first=[...sold].sort((a,b)=>{const x=a.split(',').map(Number),y=b.split(',').map(Number);return x[0]-y[0]||x[1]-y[1]})[0];
  const tpl=mine.filter(([l])=>l[1]+','+l[2]===first).map(([l])=>l);
  const unit=k=>{const[d,p]=k.split(',').map(Number);return D.lessons.map((l,i)=>[l,i]).filter(([l])=>l[1]===d&&l[2]===p&&l[4].includes(c))};
  const swappable=k=>{if(sold.has(k))return true;const u=unit(k);return u.length>0&&u.every(([l])=>l[4].length===1&&l[3]!=='PER')};
  const ok=k=>grid.has(k)&&swappable(k);
  const sizesD=[...sizes];let best=null;
  const chosen=[],usedDays=new Set();
  function leaf(){
    const T=new Set();chosen.forEach(([d,p,k])=>{for(let q=0;q<k;q++)T.add(d+','+(p+q))});
    const disp=[...T].filter(k=>!sold.has(k)),free=[...sold].filter(k=>!T.has(k));
    if(disp.length!==free.length)return;
    const units=disp.map(k=>({k,u:unit(k)}));
    let cost=0;units.forEach(({k,u})=>{const[d,p]=k.split(',').map(Number);
      const nb=[p-1,p+1].some(q=>D.lessons.some(l=>l[1]===d&&l[2]===q&&l[4].includes(c)&&u.some(([m])=>m[3]===l[3]&&m[0]===l[0])));cost+=nb?20:1});
    if(best&&cost>=best.cost)return;
    /* vacated teacher slots */
    const vac=new Map();const addV=(t,d,p)=>{const kk=t+'|'+d+'|'+p;vac.set(kk,(vac.get(kk)||0)+1)};
    mine.forEach(([l])=>addV(l[0],l[1],l[2]));units.forEach(({u})=>u.forEach(([l])=>addV(l[0],l[1],l[2])));
    const busy=(t,d,p,nw)=>{const kk=t+'|'+d+'|'+p;return G.tch[t][d][p].length-(vac.get(kk)||0)>0||nw.has(kk)};
    const nw=new Set();
    for(const[d,p,k]of chosen)for(let q=0;q<k;q++)for(const l of tpl){const kk=l[0]+'|'+d+'|'+(p+q);if(busy(l[0],d,p+q,nw))return;nw.add(kk)}
    /* assign displaced units to free cells */
    const asg=[];
    const rec=(i,usedF)=>{if(i===units.length)return true;
      for(let f=0;f<free.length;f++){if(usedF.has(f))continue;const[d,p]=free[f].split(',').map(Number);
        const added=[];let good=true;
        for(const[l]of units[i].u){const kk=l[0]+'|'+d+'|'+p;if(busy(l[0],d,p,nw)){good=false;break}nw.add(kk);added.push(kk)}
        if(good){usedF.add(f);asg[i]=free[f];if(rec(i+1,usedF))return true;usedF.delete(f)}
        added.forEach(x=>nw.delete(x))}
      return false};
    if(!rec(0,new Set()))return;
    best={cost,T:[...chosen.map(x=>x.slice())],units:units.map(u=>u.u.map(([l,i])=>i)),asg:[...asg]};
  }
  function go(i){
    if(i===sizesD.length){leaf();return}
    const k=sizesD[i];
    for(let d=0;d<DAYS.length;d++){if(usedDays.has(d))continue;
      for(let p=0;p+k<=PER.length;p++){
        let good=true;for(let q=0;q<k;q++)if(!ok(d+','+(p+q))){good=false;break}
        if(!good)continue;
        chosen.push([d,p,k]);usedDays.add(d);go(i+1);usedDays.delete(d);chosen.pop()}}
  }
  go(0);
  if(!best)return{ok:false,msg:'tiada susunan tanpa pertindihan guru'};
  /* apply */
  const rm=new Set(mine.map(([,i])=>i));best.units.forEach(u=>u.forEach(i=>rm.add(i)));
  const add=[];
  best.units.forEach((u,j)=>{const[d,p]=best.asg[j].split(',').map(Number);u.forEach(i=>{const l=D.lessons[i];add.push([l[0],d,p,l[3],l[4]])})});
  best.T.forEach(([d,p,k])=>{for(let q=0;q<k;q++)tpl.forEach(l=>add.push([l[0],d,p+q,sub,[c]]))});
  D.lessons=D.lessons.filter((_,i)=>!rm.has(i)).concat(add);
  return{ok:true,moved:best.units.length};
}
/* Cells (day,waktu) a class can hold lessons in: its own plus those of other classes in the same year, minus assembly and PKR. */
function bilGrid(c,G){

  D.classes.forEach((_,k)=>{if(k!==c&&(y==null||yearOf(k)!==y))return;
    DAYS.forEach((__,d)=>PER.forEach((___,p)=>{const es=G.cls[k][d][p];
      if(es.some(e=>e.sub==='PER'))per.add(d+','+p);
      else if(es.some(e=>e.sub!==PK.code))g.add(d+','+p)}))});

/* Change the number of waktu of subjects in class c to q[sub], with optional splits bs[sub] and teachers bt[sub] for subjects not yet in the class. */
function bilDo(c,q,bs,bt){
  const bd=bilData(c),G0=build(),y=yearOf(c);
  const live=e=>e.sub!=='PER'&&e.sub!==PK.code;
  const grid=bilGrid(c,G0);
  const log=[],miss=[];
  const slotsOfK=sub=>{const m=new Set();D.lessons.forEach(l=>{if(l[3]===sub&&l[4].includes(c))m.add(l[1]+','+l[2])});return m.size};
  const slotsOf=sub=>{const m=new Set();D.lessons.forEach(l=>{if(l[3]===sub&&l[4].includes(c))m.add(l[1]+','+l[2])});return[...m].map(k=>k.split(',').map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1])};
  bd.rows.forEach(r=>{const want=q[r.sub];if(want==null||want>=r.n)return;
    const ss=slotsOf(r.sub).slice(want);const set=new Set(ss.map(x=>x.join(',')));
    D.lessons=D.lessons.map(l=>{if(l[3]!==r.sub||!l[4].includes(c)||!set.has(l[1]+','+l[2]))return l;return[l[0],l[1],l[2],l[3],l[4].filter(x=>x!==c)]})
      .filter(l=>!(l[3]===r.sub&&l[4].length===0));
    log.push(r.sub+' -'+(r.n-want))});
  bd.rows.forEach(r=>{const want=q[r.sub];if(want==null||want<=r.n)return;
    let need=want-r.n;const tpl=[];
    if(r.n===0){
      if(isPairSub(r.sub)){const pr=pairFor(c,r.sub);if(!pr){miss.push(r.sub+' belum ada pasangan guru (menu Pairing)');return}pr.forEach(t=>tpl.push([t,0,0,r.sub,[c]]))}
      else{const t=bt&&bt[r.sub];if(t==null||!D.teachers[t]){miss.push(r.sub+' belum ada guru');return}tpl.push([t,0,0,r.sub,[c]])}}
    else{const last=slotsOf(r.sub).pop();
      D.lessons.forEach(l=>{if(l[3]===r.sub&&l[4].includes(c)&&l[1]===last[0]&&l[2]===last[1])tpl.push(l)});
      if(tpl.some(l=>l[4].length>1)){miss.push(r.sub+' dikongsi kelas lain, tambah sendiri');return}}
    while(need>0){
      const G=build(),days=new Set(slotsOf(r.sub).map(x=>x[0]));

        if(G.cls[c][d][p].length)return;
        if(tpl.some(l=>G.tch[l[0]][d][p].length))return;
        free.push([d,p,days.has(d)?1:0,/^PJ\d/.test(r.sub)&&(pjBad(d,p)||pjAdjTry(c,d))?1:0])});
      if(!free.length)break;
      free.sort((a,b)=>a[3]-b[3]||a[2]-b[2]||a[0]-b[0]||a[1]-b[1]);
      const[d,p]=free[0];tpl.forEach(l=>D.lessons.push([l[0],d,p,r.sub,[c]]));need--}
    log.push(r.sub+' +'+(want-r.n-need));if(need>0)miss.push(r.sub+' kurang '+need+' (tiada waktu kosong yang guru bebas)')});
  Object.keys(bs||{}).forEach(sub=>{const txt=bs[sub];if(!txt)return;const sz=bilParse(txt);
    if(!sz){miss.push(sub+': pecahan "'+txt+'" tidak sah');return}

    const r=bilSplit(c,sub,sz);
    if(r.ok){if(!r.same)log.push(sub+' '+sz.join('+'))}else miss.push(sub+': '+r.msg)});
  return{log,miss};
}
function bilApply(){
  const before=JSON.stringify(D.lessons);
  const{log,miss}=bilDo(S.bk,S.bq||{},S.bs||{},S.bt||{});
  if(JSON.stringify(D.lessons)===before){S.bmsg=miss.length?'Tidak berjaya: '+miss.join('; ')+'.':'Tiada perubahan.';render();return}
  S.undo=before;S.bdone=true;persist();
  S.bmsg='Diubah: '+log.join(', ')+(miss.length?'. Tidak berjaya: '+miss.join('; '):'')+'.';
  S.bq={};S.bs={};S.bt={};render();
}
function bilKurAll(y){
  const k=D.kur[y];if(!k)return;
  const before=JSON.stringify(D.lessons),out=[];
  D.classes.forEach((cl,c)=>{if(yearOf(c)!==y)return;const{log,miss}=bilDo(c,{...k},{},{});
    if(log.length||miss.length)out.push(cl.name+': '+[log.length?log.join(', '):'',miss.length?'tidak berjaya '+miss.join('; '):''].filter(Boolean).join('. '))});
  if(JSON.stringify(D.lessons)===before){S.bmsg=out.length?out.join(' | '):'Semua kelas sudah ikut kurikulum.';render();return}
  S.undo=before;S.bdone=true;persist();S.bmsg=out.join(' | ');S.bq={};S.bs={};S.bt={};render();
}

function pairAdd(){
  if(!canEdit()){toast('Anda hanya boleh melihat');return}
  const a=S.pa,b=S.pb,c3=S.pc3||'',names=Object.keys(S.pcls||{}).filter(k=>S.pcls[k]);
  if(!a||!b){S.pmsg='Pilih kedua-dua guru.';render();return}
  if(a===b||c3&&(c3===a||c3===b)){S.pmsg='Pilih guru yang berbeza.';render();return}
  if(!names.length){S.pmsg='Tanda sekurang-kurangnya satu kelas.';render();return}
  const ps=S.psub||(D.pairSubs||[])[0];if(!ps){S.pmsg='Tambah subjek berpasangan dahulu.';render();return}
  D.pairs=(D.pairs||[]).map(p=>(p.sub&&p.sub!==ps)?p:({...p,cls:(p.cls||[]).filter(n=>!names.includes(n))})).filter(p=>p.cls.length);
  D.pairs.push(c3?{a,b,c:c3,sub:ps,cls:names}:{a,b,sub:ps,cls:names});
  S.pcls={};S.pa='';S.pb='';S.pc3='';S.pmsg='Pasangan '+ps+' ditambah untuk '+names.length+' kelas.';persist();render();
}

const yLbl=y=>y===0?'Prasekolah':y==null?'Lain':'Tahun '+y;
const yShort=y=>y===0?'PRA':y==null?'?':'T'+y;
function gstData(){
  const fg=S.gg==null||S.gg===''?null:+S.gg,fs=S.gs||'',fy=S.gy==null||S.gy===''?null:+S.gy;
  const rec={},years=new Set(),allSubs=new Set();
  D.lessons.forEach(([t,d,p,sub,cs])=>{
    if(!D.teachers[t]||sub==='PER')return;allSubs.add(sub);
    cs.forEach(c=>years.add(yearOf(c)));
    if(fg!=null&&t!==fg)return;if(fs&&sub!==fs)return;
    const key=d+','+p,byY={};
    cs.forEach(c=>{const y=yearOf(c);if(fy!=null&&y!==fy)return;(byY[y]=byY[y]||[]).push(c)});
    Object.entries(byY).forEach(([y,cl])=>{const k=t+'|'+sub+'|'+y;
      const r=rec[k]||(rec[k]={t,sub,y:y==='null'?null:+y,slots:new Set(),cls:new Set()});
      r.slots.add(key);cl.forEach(c=>r.cls.add(c))})});
  return{fg,fs,fy,R:Object.values(rec),years:[...years].sort((a,b)=>(a==null?99:a)-(b==null?99:b)),allSubs:[...allSubs].sort()};
}

function anaData(){
  const T=D.teachers.map(()=>({subs:{},cls:{}})),Sx={};
  D.lessons.forEach(([t,d,p,sub,cs])=>{
    if(!T[t])return;const key=d+','+p;
    const a=T[t].subs[sub]||(T[t].subs[sub]={slots:new Set(),cls:new Set()});a.slots.add(key);
    const b=Sx[sub]||(Sx[sub]={});const e=b[t]||(b[t]={slots:new Set(),cls:new Set()});e.slots.add(key);
    cs.forEach(c=>{a.cls.add(c);e.cls.add(c);
      const k=T[t].cls[c]||(T[t].cls[c]={});(k[sub]=k[sub]||new Set()).add(key)})});
  return{T,Sx};
}

/* Per-class analysis: load, subjects, teachers and problems. */
function anaKelasData(c,G){
  const grid=bilGrid(c,G),occ=new Set(),subs={},issues=[],dayN=DAYS.map(()=>0),teach=new Set();
  DAYS.forEach((dn,d)=>PER.forEach((p,k)=>{
    const es=G.cls[c][d][k];if(!es.length)return;
    const real=es.filter(e=>e.sub!=='PER');
    if(real.length){occ.add(d+','+k);dayN[d]++}
    es.forEach(e=>{teach.add(e.t);const x=subs[e.sub]||(subs[e.sub]={sub:e.sub,slots:new Set(),t:new Set(),days:{}});
      x.slots.add(d+','+k);x.t.add(D.teachers[e.t].name);(x.days[d]=x.days[d]||new Set()).add(k);
      if(G.tch[e.t][d][k].length>1)issues.push(`${dn} waktu ${p.n}: ${D.teachers[e.t].name} bertindih (${G.tch[e.t][d][k].map(z=>z.sub).join(' dan ')})`)});
    if(k===restOf(c))issues.push(`${dn}: pelajaran pada waktu rehat (${[...new Set(es.map(e=>e.sub))].join(', ')})`)}));
  const r=restOf(c);
  Object.values(subs).forEach(x=>{
    if(/^PJ\d/.test(x.sub))[...x.slots].forEach(k=>{const[d,p]=k.split(',').map(Number);if(pjBad(d,p))issues.push(d===0?`${x.sub} pada hari ${DAYS[d]} (PJ tidak boleh hari Isnin)`:`${x.sub} ${DAYS[d]} waktu ${p+1} tamat selepas 10:40`)});
    Object.entries(x.days).forEach(([d,ks])=>{const a=[...ks].sort((u,v)=>u-v);let runs=1;for(let i=1;i<a.length;i++)if(a[i]!==a[i-1]+1)runs++;
      if(runs>1&&x.sub!=='PER')issues.push(`${x.sub} berulang pada ${DAYS[d]} (waktu ${a.map(n=>n+1).join(', ')})`)})});
  const kur=kurOf(c);
  if(kur)Object.keys(kur).forEach(sb=>{const n=subs[sb]?subs[sb].slots.size:0;if(n!==kur[sb])issues.push(`${sb}: ${n} waktu, kurikulum ${kur[sb]}`)});
  const empty=[...grid].filter(k=>!occ.has(k));
  if(empty.length)issues.push(`${empty.length} waktu kosong`);
  return{grid:grid.size,occ:occ.size,empty:empty.length,subs,issues:[...new Set(issues)],dayN,teach:teach.size,kur};

/* Penjana PDF sendiri (tanpa pustaka luar): mengukur DOM dan melukis teks/kotak/garis sebagai PDF vektor. */
function buildPdf(host,land,units){

  const place=(top,h)=>{const t=top+shAt(top),i=Math.max(0,Math.floor((t+0.01)/pageH));return[i,t-i*pageH]};

    const r=rel(el.getBoundingClientRect());if(r.w<=0||r.h<=0)continue;

    const bg=col(st.backgroundColor);
    if(bg&&bg.a>0.05&&!(bg.r>0.99&&bg.g>0.99&&bg.b>0.99))ops.push(cs(bg)+' rg '+f(X(r.l))+' '+f(Y(y+r.h))+' '+f(r.w*k)+' '+f(r.h*k)+' re f');
    const sd=[['Top',r.l,y,r.l+r.w,y],['Bottom',r.l,y+r.h,r.l+r.w,y+r.h],['Left',r.l,y,r.l,y+r.h],['Right',r.l+r.w,y,r.l+r.w,y+r.h]];

      ops.push(cs(c)+' RG '+f(Math.max(w*k,0.4))+' w '+f(X(x1))+' '+f(Y(y1))+' m '+f(X(x2))+' '+f(Y(y2))+' l S')}

  const mp={'–':'\x96','—':'\x97','‘':'\x91','’':'\x92','“':'\x93','”':'\x94','•':'\x95','…':'\x85','×':'\xd7'};
  const enc=t=>{let o='';for(const ch of t){const c=ch.charCodeAt(0);o+=mp[ch]||(c<256?ch:'?')}return o.replace(/([\\()])/g,'\\$1')};
  const tw=document.createTreeWalker(host,NodeFilter.SHOW_TEXT,{acceptNode:n=>/\S/.test(n.data)&&!/^(SCRIPT|STYLE)$/.test(n.parentNode.tagName)?1:2});

    const re=/\S+/g;let m;

  const kids=[];for(let i=0;i<np;i++)kids.push((5+i*2)+' 0 R');

  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';

  for(let i=1;i<objs.length;i++){offs[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n'}

  for(let i=1;i<objs.length;i++)out+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return{blob:new Blob([u],{type:'application/pdf'}),pages:np};
}

/* Kelas yang sudah ada guru lain untuk subjek ini: rekod borang dahulu, jadual sekarang jika guru itu belum ada rekod. Subjek pairing dikecualikan. */
function takenCls(sub,me){const m={};if(!sub||sub===LAIN||(typeof isPairSub==='function'&&isPairSub(sub)))return m;const seen=new Set();
  Object.keys(B.all).forEach(id=>{seen.add(id);if(id===me)return;const d=B.all[id];(d.subjek||[]).forEach(x=>{if(x.kod===sub)(x.kelas||[]).forEach(c=>{if(!m[c])m[c]=d.kod||d.guru})})});
  D.lessons.forEach(l=>{const t=D.teachers[l[0]];if(!t||l[3]!==sub)return;const id=docId(t.code);if(id===me||seen.has(id))return;l[4].forEach(c=>{const n=D.classes[c]&&D.classes[c].name;if(n&&!m[n])m[n]=t.code})});return m}
window.__takenCls=takenCls;
function freeCls(r,list){const tk=takenCls(r.sub,curId());return list.filter(c=>!tk[c]||r.kelas.includes(c))}
function recs(){return Object.keys(B.all).map(k=>({...B.all[k],_id:k})).sort((a,b)=>String(a.guru).localeCompare(String(b.guru)))}
/* What the timetable actually has for one teacher: subject code -> set of class names. */
function actual(code){const t=tIdx(code),m={};if(t<0)return m;
  D.lessons.forEach(l=>{if(l[0]!==t||NOTEACH.includes(l[3]))return;(m[l[3]]=m[l[3]]||new Set());l[4].forEach(c=>{if(D.classes[c])m[l[3]].add(D.classes[c].name)})});return m}
function diffFor(d){
  if(!d.kod||tIdx(d.kod)<0)return null;
  const act=actual(d.kod),form={};(d.subjek||[]).forEach(s=>{if(s.kod&&subj(s.kod))(form[s.kod]=form[s.kod]||new Set());(s.kelas||[]).forEach(c=>s.kod&&form[s.kod]&&form[s.kod].add(c))});
  const add=[],miss=[];
  Object.keys(form).forEach(k=>{const a=act[k]||new Set();const x=[...form[k]].filter(c=>!a.has(c));if(x.length)add.push(k+': '+sortCls(x).join(', '))});
  Object.keys(act).forEach(k=>{const f=form[k]||new Set();const x=[...act[k]].filter(c=>!f.has(c));if(x.length)miss.push(k+': '+sortCls(x).join(', '))});
  return{add,miss}
}

<style>
.gkmenu{position:fixed;z-index:1000;background:var(--panel,#fff);color:var(--fg,#1b2430);border:1px solid var(--line,#c8d3e3);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:12px;width:340px;max-width:calc(100vw - 16px);box-sizing:border-box}
.gkmenu .gkh{font-weight:700;margin-bottom:8px}
.gkmenu label{display:block;font-size:13px;color:var(--muted,#5b6778);margin-bottom:8px}
.gkmenu input[type=text],.gkmenu select{box-sizing:border-box;display:block;width:100%;margin-top:4px;font:inherit;font-size:14px;padding:6px;border:1px solid var(--line,#c8d3e3);border-radius:6px;background:var(--bg,#fff);color:var(--fg,#1b2430)}
.gkmenu .gka{display:flex;gap:8px;margin-top:4px}
</style>
<script>
/* Klik kanan (atau tekan lama) pada baris kelas untuk memilih guru kelas dan pembantu dengan cepat. */
(()=>{const mainEl=document.getElementById('main');
function close(){const m=document.getElementById('gkmenu');if(m)m.remove()}
document.addEventListener('mousedown',e=>{const m=document.getElementById('gkmenu');if(m&&!m.contains(e.target))close()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
mainEl.addEventListener('contextmenu',e=>{
  if(S.view!=='kelas'||S.preview)return;const tr=e.target.closest('tr.row');if(!tr)return;
  e.preventDefault();close();
  if(!canEdit()){toast('Anda hanya boleh melihat');return}
  const i=+tr.dataset.i,c=D.classes[i];if(!c)return;
  const role=code=>{const r=[];D.classes.forEach((x,j)=>{if(j===i)return;if(x.guru===code)r.push('GK '+x.name);if(x.pgk===code)r.push('P '+x.name)});return r};
  const opt=sel=>'<option value="">(tiada)</option>'+D.teachers.map(t=>{const r=role(t.code);return`<option value="${esc(t.code)}" ${sel===t.code?'selected':''}>${esc(t.name)}${r.length?' · '+esc(r.join(', ')):''}</option>`}).join('');
  const m=document.createElement('div');m.id='gkmenu';m.className='gkmenu';m.setAttribute('role','dialog');m.setAttribute('aria-label','Guru kelas '+c.name);
  m.innerHTML=`<div class="gkh">${esc(c.name)}</div><label>Guru kelas<select data-k="guru">${opt(c.guru||'')}</select></label><label>Pembantu guru kelas<select data-k="pgk">${opt(c.pgk||'')}</select></label><label>Catatan<input type="text" data-k="catatan" value="${esc(c.catatan||'')}" placeholder="Contoh: Penyelaras Tahun 1"></label><div class="gka"><button type="button" class="btn pri" data-gk="ok">Simpan</button><button type="button" class="btn" data-gk="x">Batal</button></div>`;
  document.body.appendChild(m);
  const W=m.offsetWidth,H=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(e.clientX,innerWidth-W-8))+'px';m.style.top=Math.max(8,Math.min(e.clientY,innerHeight-H-8))+'px';
  m.querySelector('select').focus();
  m.addEventListener('click',ev=>{const b=ev.target.closest('[data-gk]');if(!b)return;
    if(b.dataset.gk==='ok'){const g=m.querySelector('[data-k=guru]').value,p=m.querySelector('[data-k=pgk]').value,ct=m.querySelector('[data-k=catatan]').value.trim();
      D.classes[i]={...D.classes[i],guru:g,pgk:p,catatan:ct};persist();toast('Disimpan: '+c.name);close();render()}
    else close()});
});
})();
</script>

<style>
.gkmenu table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 8px}
.gkmenu th,.gkmenu td{border:1px solid var(--line,#c8d3e3);padding:4px 6px;text-align:left;vertical-align:top}
.gkmenu .gkn{font-size:12.5px;color:var(--muted,#5b6778);margin:0 0 6px}
.gkmenu.wide{width:440px;max-height:calc(100vh - 16px);overflow:auto}
.gkmenu.wide{width:560px}
.gkmenu .gkr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;border-top:1px dashed var(--line,#c8d3e3);padding-top:8px;margin-top:8px}
.gkmenu .gkr select{margin:0}
.gkmenu .gkcl{grid-column:1/-1;display:grid;gap:3px}
.gkmenu .gky{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;font-size:12.5px}
.gkmenu .gky>span{min-width:30px;font-weight:600;color:var(--muted,#5b6778)}
.gkmenu .gky label{display:inline-flex;align-items:center;gap:4px;margin:0;color:var(--fg,#1b2430);font-size:12.5px}
.gkmenu .gky input{margin:0}
</style>
<script>
/* Klik kanan pada nama guru (menu Guru) untuk memilih subjek dan kelas yang diajar.
   Disimpan dalam rekod borang guru itu (koleksi "borang"), sama seperti bahagian "Edit subjek dan kelas yang diajar". */
(()=>{const mainEl=document.getElementById('main');let DB=null,ALL={};
(async()=>{try{if(!window.claude||!window.claude.use)return;DB=await window.claude.use('db');if(!DB)return;DB.collection('borang').onSnapshot(sn=>{const m={};sn.docs.forEach(d=>{m[d.id]=d.data()});ALL=m;window.__BR=m},()=>{})}catch(e){}})();
const NOT=['PER','BY'],docId=x=>String(x).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,120)||'_';
function close(){const m=document.getElementById('gkmenu');if(m)m.remove()}
/* Subjek (atau guru) yang sudah ada dalam baris lain tidak boleh dipilih lagi. */
function lockPick(m){['sub','tch'].forEach(k=>{const sels=[...m.querySelectorAll('select[data-r="'+k+'"]')];
  sels.forEach(sl=>{const taken=sels.filter(o=>o!==sl&&o.value).map(o=>o.value);
    [...sl.options].forEach(op=>{if(!op.value)return;if(op.dataset.t==null)op.dataset.t=op.textContent;const off=op.value!==sl.value&&taken.includes(op.value);op.disabled=off;op.textContent=op.dataset.t+(off?' (sudah dipilih)':'')})})});
  /* Kelas yang sudah ada guru lain untuk subjek itu tidak boleh ditanda. */
  const pair=sub=>typeof isPairSub==='function'&&isPairSub(sub),boxes=g=>[...g.querySelectorAll('input[data-c]')];
  const mark=(x,who)=>{const lb=x.closest('label');x.disabled=!!who&&!x.checked;if(lb){lb.style.opacity=x.disabled?'.45':'';lb.style.textDecoration=x.disabled?'line-through':'';lb.title=who?'Sudah diajar oleh '+who:''}};
  const rows=[...m.querySelectorAll('.gkr')];
  if(m.dataset.me!=null){rows.forEach(g=>{const sub=(g.querySelector('[data-r=sub]')||{}).value,tk=window.__takenCls?window.__takenCls(sub,m.dataset.me):{};boxes(g).forEach(x=>mark(x,tk[x.dataset.c]))})}
  else if(m.dataset.sub!=null){const sub=m.dataset.sub;rows.forEach(g=>{const tk={};if(!pair(sub))rows.forEach(o=>{if(o===g)return;const who=(o.querySelector('[data-r=tch]')||{}).value||'guru lain';boxes(o).forEach(x=>{if(x.checked&&!tk[x.dataset.c])tk[x.dataset.c]=who})});boxes(g).forEach(x=>mark(x,tk[x.dataset.c]))})}}
const short=n=>String(n).replace(/^(PRA|\d)\s+/,'');
function clsGrid(sel){const by={};D.classes.forEach((c,i)=>{const y=yearOf(i);(by[y]=by[y]||[]).push(c)});
  return Object.keys(by).map(Number).sort((a,b)=>a-b).map(y=>`<div class="gky"><span>${esc(y===0?'Pra':'T'+y)}</span>${by[y].map(c=>`<label><input type="checkbox" data-c="${esc(c.name)}" ${sel.includes(c.name)?'checked':''}> ${esc(short(c.name))}</label>`).join('')}</div>`).join('')}
function subSel(v){return`<select data-r="sub"><option value="">Pilih subjek</option>${D.subjects.filter(x=>!NOT.includes(x.code)).map(x=>`<option value="${esc(x.code)}" ${x.code===v?'selected':''}>${esc(x.code)}${x.name&&x.name!==x.code?' · '+esc(x.name):''}</option>`).join('')}</select>`}
function rowHtml(r){return`<div class="gkr">${subSel(r.sub)}<button type="button" class="btn" data-gk="del" aria-label="Buang subjek">×</button><div class="gkcl">${clsGrid(r.kelas)}</div></div>`}
mainEl.addEventListener('contextmenu',e=>{
  if(S.view!=='guru'||S.preview)return;const tr=e.target.closest('tr.row');if(!tr)return;
  e.preventDefault();close();
  const ti=+tr.dataset.i,t=D.teachers[ti];if(!t)return;
  if(!canEdit()){toast('Anda hanya boleh melihat');return}
  const id=docId(t.code),rec=ALL[id];let rows;
  if(rec&&(rec.subjek||[]).length)rows=rec.subjek.map(x=>({sub:x.kod||'',kelas:x.kelas||[]}));
  else{const by={};D.lessons.forEach(l=>{if(l[0]!==ti||!l[4].length||NOT.includes(l[3]))return;const o=by[l[3]]||(by[l[3]]=new Set());l[4].forEach(c=>D.classes[c]&&o.add(D.classes[c].name))});
    rows=Object.keys(by).sort().map(k=>({sub:k,kelas:[...by[k]]}));
    (t.subs||[]).filter(x=>!NOT.includes(x)&&!by[x]).forEach(x=>rows.push({sub:x,kelas:[]}))}
  if(!rows.length)rows=[{sub:'',kelas:[]}];
  const m=document.createElement('div');m.id='gkmenu';m.className='gkmenu wide';m.setAttribute('role','dialog');m.setAttribute('aria-label','Subjek dan kelas '+t.name);m.dataset.me=docId(t.code);
  m.innerHTML=`<div class="gkh">${esc(t.name)} <span class="note">(${esc(t.code)})</span></div>
  <p class="gkn">${rec?'Rekod borang sedia ada.':'Belum ada rekod borang, diisi daripada jadual sekarang.'} Pilih subjek, kemudian tanda kelas.</p>
  <div class="gkrows">${rows.map(rowHtml).join('')}</div>
  <div class="gka"><button type="button" class="btn" data-gk="add">+ Tambah subjek</button></div>
  <div class="gka" style="margin-top:10px"><button type="button" class="btn pri" data-gk="ok">Simpan</button><button type="button" class="btn" data-gk="x">Batal</button></div>`;
  document.body.appendChild(m);lockPick(m);m.addEventListener('change',ev=>{if(ev.target.matches('select[data-r],input[data-c]'))lockPick(m)});
  const place=()=>{const W=m.offsetWidth,H=m.offsetHeight;m.style.left=Math.max(8,Math.min(e.clientX,innerWidth-W-8))+'px';m.style.top=Math.max(8,Math.min(e.clientY,innerHeight-H-8))+'px'};place();
  m.querySelector('select').focus();
  m.addEventListener('click',async ev=>{const b=ev.target.closest('[data-gk]');if(!b)return;const k=b.dataset.gk;
    if(k==='x'){close();return}
    if(k==='add'){m.querySelector('.gkrows').insertAdjacentHTML('beforeend',rowHtml({sub:'',kelas:[]}));lockPick(m);place();return}
    if(k==='del'){b.closest('.gkr').remove();lockPick(m);return}
    if(k==='ok'){b.classList.add('busy');b.textContent='Menyimpan…';
      const sub=[...m.querySelectorAll('.gkr')].map(r=>({kod:r.querySelector('[data-r=sub]').value,kelas:[...r.querySelectorAll('[data-c]:checked')].map(x=>x.dataset.c)})).filter(x=>x.kod);
      const seen=new Set();for(const x of sub){if(seen.has(x.kod)){toast('Subjek '+x.kod+' dipilih dua kali');b.classList.remove('busy');b.textContent='Simpan';return}seen.add(x.kod)}
      const data={guru:t.name,kod:t.code,subjek:sub.map(x=>{const sj=D.subjects.find(y=>y.code===x.kod);return{kod:x.kod,nama:sj?sj.name:x.kod,kelas:x.kelas}}),catatan:(rec&&rec.catatan)||'',oleh:(rec&&rec.oleh)||'',dihantar:Date.now()};
      const keep=(t.subs||[]).filter(c=>NOT.includes(c));
      D.teachers[ti]={...D.teachers[ti],subs:[...keep,...sub.map(x=>x.kod).filter(c=>!keep.includes(c))]};persist();
      if(DB){try{await DB.doc('borang/'+id).set(data);ALL[id]=data}catch(err){toast('Subjek guru disimpan, tetapi rekod kelas tidak dapat disimpan');close();render();return}}
      toast('Disimpan: '+t.name);close();render()}});
});
/* Klik kanan pada pelajaran (menu Pelajaran): pilih guru yang mengajar subjek itu dan kelasnya.
   Disimpan dalam rekod borang setiap guru (koleksi "borang"), sama seperti klik kanan pada nama guru. */
function baseRows(ti){const t=D.teachers[ti],rec=ALL[docId(t.code)];
  if(rec&&(rec.subjek||[]).length)return rec.subjek.map(x=>({kod:x.kod||'',kelas:[...(x.kelas||[])]}));
  const by={};D.lessons.forEach(l=>{if(l[0]!==ti||!l[4].length||NOT.includes(l[3]))return;const o=by[l[3]]||(by[l[3]]=new Set());l[4].forEach(c=>D.classes[c]&&o.add(D.classes[c].name))});
  const rows=Object.keys(by).sort().map(k=>({kod:k,kelas:[...by[k]]}));
  (t.subs||[]).filter(x=>!NOT.includes(x)&&!by[x]).forEach(x=>rows.push({kod:x,kelas:[]}));return rows}
function tSel(v){return`<select data-r="tch"><option value="">Pilih guru</option>${D.teachers.map(t=>`<option value="${esc(t.code)}" ${t.code===v?'selected':''}>${esc(t.name)} (${esc(t.code)})</option>`).join('')}</select>`}
function tRow(r){return`<div class="gkr">${tSel(r.t)}<button type="button" class="btn" data-gk="del" aria-label="Buang guru">×</button><div class="gkcl">${clsGrid(r.kelas)}</div></div>`}
mainEl.addEventListener('contextmenu',e=>{
  if(S.view!=='pelajaran'||S.preview)return;const tr=e.target.closest('tr.row');if(!tr)return;
  const sj=D.subjects[+tr.dataset.i];if(!sj)return;
  e.preventDefault();close();
  if(!canEdit()){toast('Anda hanya boleh melihat');return}
  if(NOT.includes(sj.code)){toast(sj.code+' bukan subjek kelas');return}
  const code=sj.code,before={};
  D.teachers.forEach((t,ti)=>{const r=baseRows(ti).find(x=>x.kod===code);if(r||(t.subs||[]).includes(code))before[t.code]=r?r.kelas:[]});
  let rows=Object.keys(before).map(c=>({t:c,kelas:before[c]}));if(!rows.length)rows=[{t:'',kelas:[]}];
  const m=document.createElement('div');m.id='gkmenu';m.className='gkmenu wide';m.setAttribute('role','dialog');m.setAttribute('aria-label','Guru yang mengajar '+code);m.dataset.sub=code;
  m.innerHTML=`<div class="gkh">${esc(code)}${sj.name&&sj.name!==code?' · '+esc(sj.name):''}</div>
  <p class="gkn">Pilih guru yang mengajar subjek ini, kemudian tanda kelas setiap guru.</p>
  <div class="gkrows">${rows.map(tRow).join('')}</div>
  <div class="gka"><button type="button" class="btn" data-gk="add">+ Tambah guru</button></div>
  <div class="gka" style="margin-top:10px"><button type="button" class="btn pri" data-gk="ok">Simpan</button><button type="button" class="btn" data-gk="x">Batal</button></div>`;
  document.body.appendChild(m);lockPick(m);m.addEventListener('change',ev=>{if(ev.target.matches('select[data-r],input[data-c]'))lockPick(m)});
  const place=()=>{const W=m.offsetWidth,H=m.offsetHeight;m.style.left=Math.max(8,Math.min(e.clientX,innerWidth-W-8))+'px';m.style.top=Math.max(8,Math.min(e.clientY,innerHeight-H-8))+'px'};place();
  m.querySelector('select').focus();
  m.addEventListener('click',async ev=>{const b=ev.target.closest('[data-gk]');if(!b)return;const k=b.dataset.gk;
    if(k==='x'){close();return}
    if(k==='add'){m.querySelector('.gkrows').insertAdjacentHTML('beforeend',tRow({t:'',kelas:[]}));lockPick(m);place();return}
    if(k==='del'){b.closest('.gkr').remove();lockPick(m);return}
    if(k!=='ok')return;b.classList.add('busy');b.textContent='Menyimpan…';
    const now=[...m.querySelectorAll('.gkr')].map(r=>({t:r.querySelector('[data-r=tch]').value,kelas:[...r.querySelectorAll('[data-c]:checked')].map(x=>x.dataset.c)})).filter(x=>x.t);
    const seen=new Set();for(const x of now){if(seen.has(x.t)){toast('Guru '+x.t+' dipilih dua kali');b.classList.remove('busy');b.textContent='Simpan';return}seen.add(x.t)}
    const after={};now.forEach(x=>{after[x.t]=x.kelas});
    const touched=[...new Set([...Object.keys(before),...Object.keys(after)])].filter(c=>JSON.stringify(before[c]||null)!==JSON.stringify(after[c]||null));
    let fail=0;
    for(const c of touched){const ti=D.teachers.findIndex(t=>t.code===c);if(ti<0)continue;const t=D.teachers[ti],id=docId(c),rec=ALL[id];
      let rs=baseRows(ti).filter(x=>x.kod!==code);if(after[c])rs.push({kod:code,kelas:after[c]});
      const keep=(t.subs||[]).filter(x=>NOT.includes(x));
      D.teachers[ti]={...t,subs:[...keep,...rs.map(x=>x.kod).filter(x=>x&&!keep.includes(x))]};
      const data={guru:t.name,kod:t.code,subjek:rs.map(x=>{const s2=D.subjects.find(y=>y.code===x.kod);return{kod:x.kod,nama:s2?s2.name:x.kod,kelas:x.kelas}}),catatan:(rec&&rec.catatan)||'',oleh:(rec&&rec.oleh)||'',dihantar:Date.now()};
      if(DB){try{await DB.doc('borang/'+id).set(data);ALL[id]=data}catch(err){fail++}}}
    persist();close();render();
    toast(fail?'Subjek guru disimpan, tetapi '+fail+' rekod kelas tidak dapat disimpan':touched.length?'Disimpan: '+code+' ('+touched.length+' guru dikemas kini)':'Tiada perubahan')});
});
})();
</script>

<script>
/* ---------- Fungsi tambahan gaya aSc: waktu tidak tersedia, kunci, kad belum diletak, relif (rekod, slip, sejarah), bertugas, Excel, versi ---------- */
(()=>{
const mainEl=document.getElementById('main');
const SEBAB=['','Cuti sakit','Cuti tanpa rekod','Khas','Rasmi','Kursus','Kerja luar','Cuti rehat khas','Lain-lain'];
window.sebabSel=code=>`<select data-xsebab="${esc(code)}" aria-label="Sebab tidak hadir" style="margin-top:3px;font-size:12px">${SEBAB.map(x=>`<option value="${esc(x)}" ${((S.rsSebab||{})[code]||'')===x?'selected':''}>${x||'Sebab (pilih)'}</option>`).join('')}</select>`;
const tByCode=c=>D.teachers.findIndex(t=>t.code===c);
const tName=c=>{const i=tByCode(c);return i>=0?D.teachers[i].name:c};
const ym=d=>String(d||'').slice(0,7);
function relifDocs(){return Object.values(RELIF||{}).filter(v=>v&&v.date)}
/* ---------- Rekod bulanan ---------- */
function rekodData(){const m=S.rmon||ym(S.rdate),docs=relifDocs().filter(v=>ym(v.date)===m),cnt={},abs={},days={};
  docs.forEach(v=>{(abs[v.absent]=abs[v.absent]||new Set()).add(v.date);(v.items||[]).forEach(it=>{cnt[it.by]=(cnt[it.by]||0)+1;(days[it.by]=days[it.by]||new Set()).add(v.date)})});
  return{m,docs,cnt,abs,days}}
function rekodTable(R){const codes=[...new Set([...Object.keys(R.cnt),...Object.keys(R.abs)])].sort((a,b)=>tName(a).localeCompare(tName(b)));
  const tot=Object.values(R.cnt).reduce((a,b)=>a+b,0);
  return`<div class="tw"><table><thead><tr><th>Guru</th><th class="mono">Waktu relif dibuat</th><th class="mono">Hari buat relif</th><th class="mono">Hari tidak hadir</th></tr></thead><tbody>${codes.map(c=>`<tr><td>${esc(U(tName(c)))} <span class="note" style="margin:0">(${esc(c)})</span></td><td class="mono">${R.cnt[c]||0}</td><td class="mono">${R.days[c]?R.days[c].size:0}</td><td class="mono">${R.abs[c]?R.abs[c].size:0}</td></tr>`).join('')||'<tr><td colspan="4">Tiada rekod relif bulan ini.</td></tr>'}</tbody>${codes.length?`<tfoot><tr><td><b>Jumlah</b></td><td class="mono"><b>${tot}</b></td><td></td><td class="mono"><b>${Object.values(R.abs).reduce((a,s)=>a+s.size,0)}</b></td></tr></tfoot>`:''}</table></div>`}
window.rekodView=()=>{if(!DBH)return'<p class="note">Rekod relif hanya tersedia dalam halaman Claude yang dikongsi (rekod disimpan dalam pangkalan data halaman).</p>';
  const R=rekodData(),pool=D.teachers.filter(t=>!t.pentadbir),zero=pool.filter(t=>!R.cnt[t.code]).length;
  return`<div class="bar"><label class="note" style="margin:0">Bulan <input type="month" id="xmon" value="${esc(R.m)}"></label><span class="grow"></span><button class="btn" data-a="xrekprint">Cetak rekod</button></div>
  <p class="note" style="margin:0 0 8px">Dikira daripada relif yang disimpan. ${zero} guru (bukan pentadbir) belum buat relif bulan ini.</p>${rekodTable(R)}`};
window.rekodPrint=()=>{const R=rekodData(),sc=D.school||{};const[y,mo]=R.m.split('-');const BL=['JANUARI','FEBRUARI','MAC','APRIL','MEI','JUN','JULAI','OGOS','SEPTEMBER','OKTOBER','NOVEMBER','DISEMBER'];
  return`<div class="noprint"><div class="bar"><span class="grow"></span>${orientBar('p')}<button class="btn" data-a="pvback">Kembali</button></div></div><section class="sec">${anaTitle('REKOD RELIF BULAN '+(BL[+mo-1]||'')+' '+y)}${rekodTable(R)}
  <div style="display:flex;gap:40px;margin-top:28px"><div style="flex:1">Disediakan oleh:<br><br><br>.............................................<br>Penyelaras Relif</div><div style="flex:1">Disahkan oleh:<br><br><br>.............................................<br>${esc(U(sc.pengesah||''))}<br>${esc(sc.jawatan||'Guru Besar')}</div></div></section>`};
/* ---------- Sejarah ketidakhadiran ---------- */
window.sejarahView=()=>{if(!DBH)return'<p class="note">Sejarah hanya tersedia dalam halaman Claude yang dikongsi.</p>';
  const m=S.rmon||ym(S.rdate),docs=relifDocs().filter(v=>!S.xall?ym(v.date)===m:true).sort((a,b)=>b.date.localeCompare(a.date)||String(a.absentName).localeCompare(String(b.absentName)));
  return`<div class="bar"><label class="note" style="margin:0">Bulan <input type="month" id="xmon" value="${esc(m)}" ${S.xall?'disabled':''}></label><label class="note" style="margin:0"><input type="checkbox" id="xall" ${S.xall?'checked':''}> Semua bulan</label></div>
  <div class="tw"><table><thead><tr><th>Tarikh</th><th>Guru tidak hadir</th><th>Sebab</th><th class="mono">Waktu diganti</th><th>Guru ganti</th></tr></thead><tbody>${docs.map(v=>`<tr><td class="mono">${esc(fmtDate(v.date))}</td><td>${esc(U(v.absentName||v.absent))}</td><td>${esc(v.sebab||'-')}</td><td class="mono">${(v.items||[]).length}</td><td>${esc([...new Set((v.items||[]).map(it=>it.by))].join(', '))}${v.statik?' <span class="note" style="margin:0">(statik)</span>':''}</td></tr>`).join('')||'<tr><td colspan="5">Tiada rekod.</td></tr>'}</tbody></table></div>`};
/* ---------- Slip guru ganti ---------- */
window.slipPrint=()=>{const R=rsData(),g={};R.blocks.forEach(b=>{if(b.pick>=0)(g[b.pick]=g[b.pick]||[]).push(b)});const sc=D.school||{};
  const slips=Object.keys(g).map(Number).sort((a,b)=>D.teachers[a].name.localeCompare(D.teachers[b].name)).map(t=>`<div style="border:1.5px dashed #555;border-radius:6px;padding:10px 12px;margin:0 0 12px;break-inside:avoid">
    <div style="display:flex;justify-content:space-between;gap:10px"><b>SLIP RELIF</b><span>${esc(U(sc.name||''))}</span></div>
    <div style="margin:4px 0 6px">Kepada: <b>${esc(U(D.teachers[t].name))}</b> · ${esc(fmtDate(S.rdate))}</div>
    <table><thead><tr><th>Waktu</th><th>Masa</th><th>Kelas</th><th>Ganti untuk</th></tr></thead><tbody>${g[t].map(b=>`<tr><td>${rsRange(b)}</td><td>${rsTime(b)}</td><td><b>${esc(D.classes[b.c].name)}</b></td><td>${esc(U([...new Set(b.a.flatMap(x=>x.by))].map(i=>D.teachers[i].name).join(', ')))}</td></tr>`).join('')}</tbody></table>
    <div style="margin-top:6px;font-size:12px">Jumlah: ${g[t].reduce((n,b)=>n+b.a.length,0)} waktu. Terima kasih.</div></div>`).join('');
  const txt=Object.keys(g).map(Number).map(t=>`*Relif ${fmtDate(S.rdate)}* — ${D.teachers[t].name}\n`+g[t].map(b=>`• ${rsRange(b)} (${rsTime(b)}) ${D.classes[b.c].name}`).join('\n')).join('\n\n');
  S.slipTxt=txt;
  return`<div class="noprint"><div class="bar"><span class="grow"></span><button class="btn" data-a="xslipcopy">Salin untuk WhatsApp</button>${orientBar('p')}<button class="btn" data-a="pvback">Kembali</button></div></div><section class="sec">${slips||'<p>Tiada guru ganti.</p>'}</section>`};
/* ---------- Waktu tidak tersedia guru ---------- */
function waktuGuruView(){const ed=canEdit();if(S.xot==null||S.xot>=D.teachers.length)S.xot=0;const i=S.xot,t=D.teachers[i],off=t.off||[],G=build();
  const head=`<tr><th>Hari</th>${PER.map(p=>`<th class="mono">${p.n}<br><span class="note" style="margin:0">${h12(p.s)}</span></th>`).join('')}</tr>`;
  const rows=DAYS.map((dn,d)=>`<tr><th>${dn}</th>${PER.map((_,p)=>{const k=d+','+p,on=off.includes(k),es=G.tch[i][d][p];return`<td style="text-align:center;cursor:${ed?'pointer':'default'};background:${on?'#f6c7c7':''}" ${ed?`data-xoff="${k}"`:''} title="${on?'Tidak tersedia':'Tersedia'}">${on?'<b style="color:#b00">✕</b>':''}${es.length?`<div style="font-size:10px">${esc(es.map(e=>e.sub).join('/'))}</div>`:''}</td>`}).join('')}</tr>`).join('');
  const list=D.teachers.map((x,j)=>[x,j]).filter(([x])=>(x.off||[]).length).map(([x,j])=>`<li><button class="btn" data-xotsel="${j}" style="padding:2px 8px">${esc(x.name)}</button> ${(x.off||[]).length} waktu</li>`).join('');

function miniXlsx(sheets){
  const enc=new TextEncoder(),xe=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');

  const files=[];const add=(name,str)=>files.push({name,data:enc.encode(str)});
  add('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`);
  add('_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
  add('xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s.name).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`);
  add('xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}</Relationships>`);
  sheets.forEach((s,i)=>add(`xl/worksheets/sheet${i+1}.xml`,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${s.cols?`<cols>${s.cols.map((w,k)=>`<col min="${k+1}" max="${k+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`:''}<sheetData>${s.rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>v===''||v==null?'':typeof v==='number'?`<c r="${col(ci)}${ri+1}"><v>${v}</v></c>`:`<c r="${col(ci)}${ri+1}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`).join('')}</row>`).join('')}</sheetData></worksheet>`));
  const T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}
  const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
  const parts=[],cent=[];let off=0;
  const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  files.forEach(f=>{const nm=enc.encode(f.name),c=crc(f.data),sz=f.data.length;
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,f.data);
    cent.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+sz});
  const cs=cent.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...parts,...cent,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

  if(a==='xvsave'){const n=document.getElementById('xvnama');await versiSave(n&&n.value.trim());return}
  if(a==='xvno'){S.xvAsk=null;render();return}
  if(a==='xslipcopy'){copy(S.slipTxt||'');return}
},true);
mainEl.addEventListener('change',e=>{const t=e.target;
  if(t.id==='xmon'&&t.value){S.rmon=t.value;render();return}
  if(t.id==='xall'){S.xall=t.checked;render();return}
  if(t.id==='xot'){S.xot=+t.value;render();return}
  if(t.dataset&&t.dataset.xsebab!=null){S.rsSebab=S.rsSebab||{};S.rsSebab[t.dataset.xsebab]=t.value;return}
  if(t.dataset&&t.dataset.xduty){const[j,d,k]=t.dataset.xduty.split('|');D.duties=D.duties||{};D.duties[j]=D.duties[j]||{};const a=(D.duties[j][d]||['','']).slice();a[+k]=t.value;D.duties[j][d]=a;persist();render();return}
  if(t.id==='xdtypes'){const a=t.value.split(',').map(x=>x.trim()).filter(Boolean);D.dutyTypes=a.length?a:null;persist();render();return}
});
})();
</script>


<script>
/* Reben pratonton cetak gaya aSc: halaman sebelum/seterusnya, pilih laporan, tapis, gaya, warna, tutup. */
(()=>{const mainEl=document.getElementById('main');
  mainEl.addEventListener('click',e=>{const b=e.target.closest('[data-pvx]');if(!b||!S.preview||b.disabled)return;e.stopPropagation();const a=b.dataset.pvx;
    if(a==='prev'){S.pvPg=(S.pvPg||0)-1}else if(a==='next'){S.pvPg=(S.pvPg||0)+1}
    else if(a==='filter'){S.preview=S.preview==='pilih'?'kelas':'pilih';S.pvPg=0}
    else if(a==='all'){S.pvAllPg=!S.pvAllPg}
    else if(a==='style'){const o=['putih','asc','biasa'],k=o.indexOf(S.gaya||'putih');S.gaya=o[(k+1)%o.length];try{localStorage.setItem('jw-gaya',S.gaya)}catch(_){}}
    else if(a==='mono'){S.pvMono=!S.pvMono;document.body.classList.toggle('mono',S.pvMono)}
    else if(a==='set'){S.preview=null;S.view='sekolah'}
    else if(a==='close'){S.preview=null}
    render();if(a!=='mono')window.scrollTo(0,0)},true);
  mainEl.addEventListener('change',e=>{const t=e.target.closest('[data-pvsel]');if(!t)return;S.preview=t.value;S.pvPg=0;render()});
  document.addEventListener('keydown',e=>{if(!S.preview||/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement||{}).tagName||''))return;
    if(e.key==='PageDown'||e.key==='ArrowRight'){const b=document.querySelector('[data-pvx="next"]');if(b&&!b.disabled){e.preventDefault();b.click()}}
    if(e.key==='PageUp'||e.key==='ArrowLeft'){const b=document.querySelector('[data-pvx="prev"]');if(b&&!b.disabled){e.preventDefault();b.click()}}});
})();
</script>
<script>
/* Anak panah untuk ke kelas/guru sebelum atau seterusnya dalam paparan Jadual (juga kekunci ← dan → bila tiada medan aktif). */
(()=>{const mainEl=document.getElementById('main');
  function go(n){if(S.view!=='jadual'||S.preview)return false;const arr=S.jMode==='kelas'?D.classes:D.teachers,j=(S.jSel||0)+n;if(j<0||j>=arr.length)return false;S.jSel=j;render();return true}
  mainEl.addEventListener('click',e=>{const b=e.target.closest('[data-jnav]');if(!b||b.disabled)return;e.stopPropagation();go(+b.dataset.jnav)},true);
  document.addEventListener('keydown',e=>{if(S.view!=='jadual'||S.preview||S.edit||e.altKey||e.ctrlKey||e.metaKey)return;const ae=document.activeElement;if(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))return;if(document.getElementById('layer')&&document.getElementById('layer').innerHTML)return;
    if(e.key==='ArrowRight'&&go(1))e.preventDefault();if(e.key==='ArrowLeft'&&go(-1))e.preventDefault()});
})();
</script>
